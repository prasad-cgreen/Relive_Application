function icon(name, size=''){return `<svg class="ico ${size}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.info}</svg>`;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return v===null||v===undefined||v===''?'Not reported':'\u20b9'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:0});}
function date(v){if(!v)return 'Not reported';return `${Number(v.slice(6,8))} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(v.slice(4,6))-1]} ${v.slice(0,4)}`;}

function link(label,path,cls='btn primary',ico='arrow'){return `<a class="${cls}" href="${href(path)}">${label}${ico?icon(ico,'sm'):''}</a>`;}

function chrome(body){const p=routeInfo().path;const titles={report:'Your credit report',loading:'Preparing your summary',summary:'My summary',accounts:'My accounts',account:'Account details',situation:'My situation',plan:'My resolution plan',support:'Help & guidance',confirmation:'Request preview'};return `<a class="skip-link" data-action="skip" href="#main-content">Skip to content</a><div class="previewbar"><b>INTERACTIVE PREVIEW</b><span class="desktop-preview">Supplied report &middot; No live API calls or messages</span><span class="divider"></span><a href="#/summary">View summary</a><button data-action="restart">Restart journey</button></div>${nav()}<div class="shell"><header class="topbar"><div class="topbar-left">Relive ${icon('chevron','sm')}<strong>${titles[p]||'Your overview'}</strong></div><div class="mobile-brand"><button class="menu-toggle" data-action="menu" aria-label="Open navigation" aria-expanded="false">${icon('menu')}</button>Relive <span>by CGreen</span></div><div class="topbar-right"><a href="#/support" class="top-help">${icon('help','sm')}Need a hand?</a><div class="user"><div class="avatar" aria-hidden="true">S</div><span>Shakti</span></div></div></header><main id="main-content" class="content" tabindex="-1"><div class="print-only"><h2>Relive by CGreen</h2><p>Design prototype &middot; supplied report dated 5 November 2026</p></div>${body}${footer()}</main></div>`;}
function requestPage(){return `<div class="journey-crumbs"><span class="current"><span class="crumb-dot">1</span>Your concern</span>${icon('chevron','sm')}<span><span class="crumb-dot">2</span>Your summary</span>${icon('chevron','sm')}<span><span class="crumb-dot">3</span>Your next step</span></div><div class="intro-grid"><div class="intro-main"><div class="eyebrow">A FRESH START BEGINS WITH CLARITY</div><h1 tabindex="-1">Let&rsquo;s understand<br>what is weighing on you.</h1><p class="lede">Your credit report is the starting point. We will turn the details into a clear picture of your debt and the next steps worth exploring.</p><form id="report-form"><fieldset style="border:0;padding:0;margin:0"><legend class="form-label">What brings you to Relive today?</legend><div class="goal-grid">${GOALS.map((g,i)=>`<label class="goal-option"><input type="radio" name="goal" value="${esc(g)}" ${state.goal===g?'checked':''} required><span>${esc(g)}</span></label>`).join('')}</div></fieldset><div class="field"><label for="story">Tell us in your own words <span class="optional">Optional</span></label><textarea id="story" name="story" maxlength="800" placeholder="For example: I want to close my debts, but I do not know which lender to approach first.">${esc(state.story)}</textarea></div><label class="consent"><input type="checkbox" name="consent" ${state.consent?'checked':''} required><span>I agree to the use of my credit report and the information I provide to prepare a Relive assessment.</span></label><div class="btn-row"><button class="btn primary" type="submit">Get my credit report ${icon('arrow','sm')}</button><button type="button" class="text-link" data-action="privacy">How my information is used ${icon('info','sm')}</button></div><p class="fine space-top">Prototype only: this opens the report already supplied for review. It does not request a new report or send information to an AI service. Consent wording is illustrative, not a production consent notice.</p></form></div><aside class="intro-art"><div class="eyebrow">BEYOND THE CREDIT SCORE</div><h2>Understand the situation.<br>See a way forward.</h2><div class="promise-row"><span class="promise-num">01</span><div><h3>A clear summary</h3><p>See what is reported, what needs attention and what still needs to be confirmed.</p></div></div><div class="promise-row"><span class="promise-num">02</span><div><h3>Account-by-account guidance</h3><p>Understand which lender discussions to begin and why. No unexplained rankings.</p></div></div><div class="promise-row"><span class="promise-num">03</span><div><h3>A plan that starts with you</h3><p>Your income, essential needs and available funds shape the next step.</p></div></div><div class="intro-art-bottom">${icon('heart')}No judgement. No guaranteed outcomes. Just clarity.</div></aside></div>`;}
function loadingPage(){return `<div class="card loading-wrap"><div class="loading-symbol">${icon('spark','lg')}</div><div class="eyebrow" style="justify-content:center">YOUR REPORT, MADE CLEARER</div><h1 tabindex="-1">Putting the details<br>into perspective.</h1><p>Organising the supplied report into a summary, account-level findings and possible next steps.</p><div class="loading-steps">${['Opening the supplied report','Organising 13 account records','Preparing your assessment preview'].map((s,i)=>`<div class="loading-step" id="load-${i}"><span class="check-circle">${i+1}</span>${s}</div>`).join('')}</div><div class="progress" role="progressbar" aria-label="Preparing report preview" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill"></div></div><p class="fine space-top">Simulated loading only. No new bureau pull or live AI analysis is taking place.</p>${link('View summary now','summary','btn secondary','arrow')}</div>`;}
function reasonFor(a){if(a.group==='review')return 'No write-off marker is shown, but the latest reported delay is 593 days. Confirm current dues and available repayment arrangements.';if(a.group==='writeoff')return a.last==='9514'?'The reported overdue exceeds the balance. Confirm both figures before discussing a repayment or settlement option.':'A write-off record and an outstanding balance appear together. Confirm current dues and discuss available resolution options.';if(a.group==='transfer')return 'Confirm the current debt owner and reconcile the reported amounts. A potentially linked Poonawalla record appears in the report.';if(a.group==='monitor')return 'No overdue is reported, but the balance is missing. Check the latest statement rather than assuming the balance is zero.';if(a.last==='1370')return 'This closed entry may be linked to the Shriram record. Verify the transfer; do not create a second payment task.';return 'Shown as a closed account with a zero reported balance. Keep the record for reference.';}
function startCard(a){return `<article class="card account-start"><div class="lender-top">${logo(a)}<div><h3>${esc(a.name)}</h3><p>${a.kind} &middot; &bull;&bull; ${a.last}</p></div>${badge(a.group==='review'?'Review first':a.group==='transfer'?'Verify first':'In parallel',a.group==='review'?'amber':a.group==='transfer'?'blue':'gray')}</div><div class="account-numbers"><div><small>Reported outstanding</small><strong>${money(a.balance)}</strong></div><div><small>Reported overdue</small><strong>${money(a.overdue)}</strong></div></div><p class="reason">${reasonFor(a)}</p><div class="card-actions"><span class="fine">Updated ${date(a.reported)}</span>${link('View account',`account?id=${a.id}`,'text-link','arrow')}</div></article>`;}
function startSection(group='review'){const all=A.filter(a=>a.group===group);return `<div class="starting-grid">${all.slice(0,2).map(startCard).join('')}${group==='transfer'?`<div class="reassurance"><div class="eyebrow">BEFORE ANY PAYMENT</div><h3>One loan may have<br>two report entries.</h3><p>The Poonawalla and Shriram entries share masked loan details. Their relationship needs confirmation, not a second payment instruction.</p>${link('See the linked record','account?id=account-11','btn secondary small')}</div>`:''}</div>${group==='writeoff'?`<div class="space-top">${link('View all 6 write-off records','accounts?filter=writeoff','text-link')}</div>`:''}`;}
function summaryPage(){return `${heading('YOUR CREDIT REPORT, EXPLAINED','Shakti, here&rsquo;s where you stand.','A clear picture of your debt. A practical next step.')}${state.goal?`<div class="pill" style="margin-bottom:19px">Your concern: ${esc(state.goal)}</div>`:''}<div class="hero-grid"><section class="card assessment" aria-label="Relive AI assessment"><div class="assessment-top"><div class="ai-label"><span class="ai-icon">${icon('spark','sm')}</span>RELIVE AI ASSESSMENT</div>${badge('Initial review','green')}</div><h2>Your overdue debt needs<br>a clear resolution plan.</h2><p>Your report shows <strong>9 overdue accounts</strong>, including <strong>6 with write-off records</strong>. The latest reported delays range from <strong>552 to 598 days</strong>.</p><p style="margin-top:10px">Start by confirming current dues and what you can manage. Then explore lender discussions and resolution options, one account at a time.</p><div class="assessment-note">${icon('info','sm')}<span>Report-based assessment preview. Affordability and lender terms are not yet confirmed.</span></div></section><aside class="card next-card"><div class="step-icon">${icon('plan')}</div><div class="eyebrow">YOUR NEXT STEP</div><h3>Let&rsquo;s build a plan<br>around your situation.</h3><p>Tell us what you can afford without affecting your essential needs.</p>${link('Build my resolution plan','situation','btn primary','arrow')}${link('I would prefer to speak to someone','support','text-link','')}</aside></div><section class="metrics" aria-label="Report facts"><div class="metric"><div class="metric-label">Reported outstanding ${icon('wallet','sm')}</div><div class="metric-value">&#8377;12.87 <span>lakh</span></div><div class="metric-note">${money(D.reportedTotal)} in the bureau summary</div></div><div class="metric"><div class="metric-label">Accounts with overdue payments ${icon('accounts','sm')}</div><div class="metric-value">9 <span>of 13 records</span></div><div class="metric-note">Based on reported overdue amounts</div></div><div class="metric"><div class="metric-label">Of these, with write-off records ${icon('report','sm')}</div><div class="metric-value">6 <span>accounts</span></div><div class="metric-note">Included in the 9 overdue accounts</div></div></section><div class="report-strip"><span class="mini-score">Credit score <strong>602</strong></span><span>${icon('clock','sm')}Overdue-account updates: 30 Sep&ndash;23 Oct 2026</span><span>${icon('info','sm')}Figures are not live payable amounts.</span></div><div class="section-heading"><div><h2>Where should you start?</h2><p>Suggested lender reviews, with the reason behind each step.</p></div>${link('All accounts','accounts','text-link')}</div><div class="choice-tabs" aria-label="Suggested review groups">${[['review','Review first','2'],['writeoff','In parallel','6'],['transfer','Verify ownership','1']].map(([g,t,n])=>`<button class="tab" data-action="start-tab" data-group="${g}" aria-pressed="${state.startTab===g}">${t}<span>${n}</span></button>`).join('')}</div><div id="start-panel">${startSection(state.startTab)}</div><div class="callout space-top">${icon('info','sm')}<div><strong>Review first does not mean pay first.</strong>Your payment order depends on verified dues, your available funds, any urgent deadlines and the actual terms offered by lenders.</div></div><div class="section-heading"><div><h2>A few details need checking</h2><p>We show the gaps, rather than filling them with assumptions.</p></div>${badge('4 report checks','amber')}</div><div class="checks-grid"><div class="card pad"><div class="check-row">${icon('warning','sm')}<div><h4>IDFC FIRST personal loan &middot; &bull;&bull; 9514</h4><p>Reported overdue ${money(223484)} is higher than the balance ${money(93749)}.</p>${link('Check account details','account?id=account-4','text-link')}</div></div><div class="check-row">${icon('link','sm')}<div><h4>Shriram / Poonawalla &middot; &bull;&bull; 1370</h4><p>Potential transfer link. Confirm ownership and reconcile the overdue and balance figures.</p>${link('Review the possible transfer','account?id=account-3','text-link')}</div></div><div class="check-row">${icon('accounts','sm')}<div><h4>Axis Bank card &middot; &bull;&bull; 9197</h4><p>No overdue is reported. The current balance is missing, not confirmed as zero.</p>${link('View this account','account?id=account-9','text-link')}</div></div><div class="check-row">${icon('info','sm')}<div><h4>Small difference in the report totals</h4><p>The account balances total ${money(1286649)}; the bureau summary states ${money(1286648)}. Both source values are retained.</p></div></div></div><aside class="reassurance">${icon('heart','lg')}<h3>Your next step does not<br>have to be a payment.</h3><p>It can be understanding an amount, sharing your situation or asking for a lender discussion. Start with what is manageable.</p>${link('Tell us about your situation','situation','btn secondary')}</aside></div><details class="details-fold"><summary>What this report can and cannot tell us</summary><div class="fold-body">It shows 13 account records: 10 reported as active and 3 closed. An active record does not necessarily mean payments are current. The report does not establish your present income, essential expenses or a reliable total monthly EMI. Reported balances may have changed after the lender update dates. No settlement, repayment arrangement, payment priority or score improvement is confirmed by this screen.</div></details><div class="mobile-cta"><div><strong>One manageable step.</strong><small>Start with your situation.</small></div>${link('Build my plan','situation','btn primary','arrow')}</div>`;}
const FILTERS=[['all','All records',13],['overdue','Overdue',9],['review','Review first',2],['writeoff','Write-off',6],['transfer','Ownership check',1],['closed','Closed',3]];
function accountList(filter='all',search=''){let list=A.filter(a=>filter==='all'||filter==='overdue'&&a.overdue>0||a.group===filter);const q=search.trim().toLowerCase();if(q)list=list.filter(a=>(a.name+' '+a.last+' '+a.kind).toLowerCase().includes(q));const order={review:0,transfer:1,writeoff:2,monitor:3,closed:4};list.sort((a,b)=>order[a.group]-order[b.group]||(b.balance||0)-(a.balance||0));return {count:list.length,html:list.length?list.map(a=>`<article class="card account-row"><div class="lender-top">${logo(a)}<div><h3>${esc(a.name)}</h3><p>${a.kind} &middot; &bull;&bull; ${a.last}</p></div></div><div class="row-amount"><span>Reported outstanding</span><strong>${money(a.balance)}</strong>${a.balance===null?'<small>Statement needed</small>':''}</div><div class="row-amount"><span>Reported overdue</span><strong>${money(a.overdue)}</strong>${a.balance!==null&&a.overdue>a.balance?'<small>Amount needs checking</small>':''}</div><div class="row-status">${groupBadge(a)}<small style="margin-top:5px">${date(a.reported)}</small></div><a href="#/account?id=${a.id}" class="icon-btn row-arrow" aria-label="View ${esc(a.name)} account ending ${a.last}">${icon('chevron','sm')}</a></article>`).join(''):`<div class="card empty">${icon('search','lg')}<h3>No matching accounts</h3><p>Try a lender name or the last four digits, or choose another filter.</p></div>`};}
function accountsPage(){const requested=routeInfo().query.get('filter')||'all';const f=FILTERS.some(x=>x[0]===requested)?requested:'all';const list=accountList(f);return `${heading('ACCOUNT-BY-ACCOUNT CLARITY','Your accounts, in one place.','Reported records, not payment instructions. Open any account to see the evidence.')}<div class="callout">${icon('info','sm')}<div>The report contains <strong style="display:inline">13 records, including 3 closed records.</strong> Poonawalla and Shriram may represent the same transferred loan. The possible link still needs verification.</div></div><div class="filter-toolbar space-top"><div class="choice-tabs" style="margin-bottom:0" aria-label="Filter accounts">${FILTERS.map(([v,t,n])=>`<button class="tab" data-action="account-filter" data-filter="${v}" aria-pressed="${v===f}">${t}<span>${n}</span></button>`).join('')}</div></div><div class="searchbox"><label for="account-search" class="sr-only">Search lender or last four account digits</label>${icon('search','sm')}<input id="account-search" type="search" placeholder="Search lender or last 4 digits" autocomplete="off" data-filter="${f}"></div><div id="result-count" class="result-note" role="status">Showing ${list.count} of 13 report records &middot; grouped by suggested review, not payment order</div><div id="account-results" class="account-list">${list.html}</div><div class="callout space-top">${icon('info','sm')}<div>Amounts labelled outstanding, overdue and written off are separate reported fields. They must not be added together as if they were separate debts.</div></div>`;}
function accountPage(){const a=getAccount(routeInfo().query.get('id'))||getAccount('account-2');const mismatch=a.balance!==null&&a.overdue>a.balance;const latest=a.history.slice(0,12).reverse();const needs=a.group==='review'?'Start a lender discussion':a.group==='transfer'?'Confirm the current debt owner':a.group==='writeoff'?'Review possible resolution options':a.group==='monitor'?'Check the latest card statement':'Keep this record for reference';const ask=a.group==='closed'?['Confirm the closure record if it differs from your documents.','For a transferred account, check who owns it now.','Keep closure or transfer documentation for reference.']:['Request a current statement and an explanation of the dues.',a.group==='transfer'?'Ask for documents confirming the current creditor and transfer.':'Explain your present repayment capacity before discussing terms.','Obtain any proposed arrangement in writing before deciding.'];return `<a class="back-link" href="#/accounts">${icon('left','sm')}Back to my accounts</a><div class="detail-grid"><div><section class="card detail-top"><div class="eyebrow">REPORTED ACCOUNT DETAILS</div><div class="detail-title">${logo(a)}<div><h1 tabindex="-1">${esc(a.name)}</h1><p>${a.kind} &middot; Account ending ${a.last}</p><div style="margin-top:10px">${groupBadge(a)}</div></div></div><div class="detail-values"><div class="detail-value"><small>Reported outstanding</small><strong>${money(a.balance)}</strong></div><div class="detail-value"><small>Reported overdue</small><strong>${money(a.overdue)}</strong></div></div><div class="source-label">Lender update: ${date(a.reported)} &middot; Report date: 5 Nov 2026</div>${mismatch?`<div class="callout amber space-top">${icon('warning','sm')}<div><strong>These amounts need an explanation.</strong>The reported overdue is higher than the balance. Neither figure is treated as a confirmed payment amount.</div></div>`:''}${a.balance===null?`<div class="callout amber space-top">${icon('info','sm')}<div><strong>The current balance was not reported.</strong>Missing does not mean zero. Please obtain the latest statement.</div></div>`:''}<dl class="definition-list"><div><dt>Account opened</dt><dd>${date(a.opened)}</dd></div><div><dt>Latest reported payment delay</dt><dd>${a.dpd===null?'Not reported':a.dpd+' days past due'}</dd></div><div><dt>Original / highest reported amount</dt><dd>${money(a.original)}</dd></div><div><dt>${a.closed?'Reported closure date':'Monthly scheduled payment'}</dt><dd>${a.closed?date(a.closed):'Not reported'}</dd></div>${a.writeoffAmount!==null&&a.writeoffAmount>0?`<div><dt>Reported written-off amount</dt><dd>${money(a.writeoffAmount)}</dd></div>`:''}${a.limit!==null?`<div><dt>Reported credit limit</dt><dd>${money(a.limit)}</dd></div>`:''}</dl><details class="details-fold"><summary>See the source fields</summary><div class="fold-body"><p>Source lender name: ${esc(a.sourceName)}</p><p>Account status code: <strong>${esc(a.codes.account)}</strong><br>Write-off / settlement field: <strong>${esc(a.codes.writeoff||'Blank')}</strong></p><p>Status-code interpretation requires the exact provider dictionary in production. This screen does not infer a legal finding from these codes.</p></div></details></section><section class="card pad space-top"><h2 style="font-size:20px">Reported payment history</h2><p class="smallcopy muted" style="margin-top:7px">Most recent ${latest.length} reported months. The numbers show days past due, not how much is payable.</p><div class="history-grid">${latest.map(h=>`<div class="history-cell ${h.dpd===null?'unknown':h.dpd>0?'late':'good'}"><span>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][h.month-1]} ${String(h.year).slice(-2)}</span><strong>${h.dpd===null?'&mdash;':h.dpd}</strong><small>${h.dpd===null?'Not reported':'days past due'}</small></div>`).join('')}</div><div class="mini-legend"><span><i class="dot" style="background:#b18354"></i>Reported delay</span><span><i class="dot" style="background:#7c9b62"></i>0 days past due</span><span><i class="dot" style="background:#b6bdae"></i>Not reported</span></div><details class="details-fold"><summary>All ${a.history.length} reported history entries</summary><div class="table-wrap"><table><caption class="sr-only">Full payment history for ${esc(a.name)} ending ${a.last}</caption><thead><tr><th scope="col">Reporting month</th><th scope="col">Days past due</th></tr></thead><tbody>${a.history.map(h=>`<tr><td>${['January','February','March','April','May','June','July','August','September','October','November','December'][h.month-1]} ${h.year}</td><td>${h.dpd===null?'Not reported':h.dpd}</td></tr>`).join('')}</tbody></table></div></details></section>${a.last==='1370'?`<section class="callout space-top">${icon('link')}<div><strong>Potentially linked report entry</strong>${a.group==='closed'?'Shriram Asset Reconstruction':'Poonawalla Fincorp'} has the same masked loan reference, opening date and original amount. Verify the transfer before treating these as separate obligations.<div style="margin-top:10px">${link('View linked record',`account?id=${a.group==='closed'?'account-3':'account-11'}`,'text-link')}</div></div></section>`:''}</div><aside><section class="card action-note"><div class="eyebrow">SUGGESTED NEXT STEP</div><h3>${needs}</h3><p>${reasonFor(a)}</p><div class="step-list">${ask.map((x,i)=>`<div class="step-list-item"><span class="number">${i+1}</span><span>${x}</span></div>`).join('')}</div><div class="space-top"><button class="btn primary full" data-action="message" data-id="${a.id}">${icon('chat','sm')}Prepare a lender message</button>${link('Get help with this account',`support?account=${a.id}`,'btn secondary full','arrow')}</div><p class="fine">No lender has been contacted and no terms are confirmed through this prototype.</p></section><section class="reassurance space-top"><div class="eyebrow">YOUR BUDGET COMES FIRST</div><h3>A reported balance is<br>not your payment plan.</h3><p>Share what is manageable so the next discussion reflects your circumstances.</p>${link('Add my situation','situation','btn secondary small')}</section></aside></div>`;}
function numericField(name,label,description,required=true){const v=state.situationDraft[name]??'';return `<div class="field"><label for="${name}">${label}${!required?'<span class="optional">Optional</span>':''}</label><div class="currency-input"><span aria-hidden="true">&#8377;</span><input type="number" id="${name}" name="${name}" value="${esc(v)}" min="0" max="1000000000" step="1" inputmode="numeric" placeholder="Enter amount" ${required&&!state.situationDraft.noPay?'required':''} data-monthly="${required}"></div><small>${description}</small></div>`;}
function budgetValues(d){const fields=['income','essentials','commitments','buffer'];const complete=fields.every(k=>d[k]!==''&&d[k]!==undefined&&Number.isFinite(Number(d[k]))&&Number(d[k])>=0);const raw=complete?Number(d.income)-Number(d.essentials)-Number(d.commitments)-Number(d.buffer):null;return {complete,raw,remaining:d.noPay?0:raw===null?null:Math.max(0,raw)};}
function situationPage(){const d=state.situationDraft;return `${heading('A PLAN THAT STARTS WITH YOU','What is manageable for you?','Your essential needs come first. The report alone cannot tell us what you can afford.')}<div class="flow-status"><span class="done">${icon('circleCheck','sm')}Report available</span><span class="separator"></span><span class="current">${icon('situation','sm')}Your situation</span><span class="separator"></span><span>${icon('plan','sm')}Draft plan</span></div><form id="situation-form"><div class="form-grid"><div><section class="card form-card"><h2>Your monthly picture</h2><p>Enter your current take-home amounts. Use zero where there is no amount; leave nothing assumed.</p><label class="form-state"><input type="checkbox" name="noPay" id="noPay" ${d.noPay?'checked':''}><span><strong>I cannot afford a payment right now.</strong><br><span class="fine">You can continue without the monthly amounts. We will show a support-led review, not a repayment promise.</span></span></label><div class="fields-two">${numericField('income','Monthly take-home income','Your current net income, after deductions.')}${numericField('essentials','Essential household expenses','Housing, food, utilities, healthcare and dependants.')}${numericField('commitments','Existing monthly commitments','Repayments or other commitments you are actually maintaining. Do not repeat household expenses.')}${numericField('buffer','Amount to protect for contingencies','Keep a buffer for irregular or essential unexpected expenses. Enter zero only if appropriate.')}</div><div class="callout">${icon('info','sm')}<div>We do not infer your current income from the bureau report or treat blank monthly-payment fields as zero.</div></div></section><section class="card form-card"><h2>Anything else we should consider?</h2><p>These details can change which discussion needs attention first.</p><div class="fields-two">${numericField('oneoff','One-time amount available','Only funds available without compromising essential needs. Blank means not confirmed.',false)}<div class="field"><label for="notice">Legal notice or urgent deadline?</label><select name="notice" id="notice" required><option value="">Select an answer</option>${[['no','No, not to my knowledge'],['yes','Yes, I have received one'],['unsure','I am not sure']].map(([v,t])=>`<option value="${v}" ${d.notice===v?'selected':''}>${t}</option>`).join('')}</select><small>A notice or deadline needs human review. The AI summary does not assess legal validity.</small></div></div><div class="field"><label for="otherDebts">Other debts or commitments <span class="optional">Optional</span></label><textarea name="otherDebts" id="otherDebts" maxlength="800" placeholder="Include any debt missing from the report or a commitment not included above.">${esc(d.otherDebts||'')}</textarea><small>These details are not automatically added to the monthly calculation. Avoid counting the same commitment twice.</small></div><label class="check-option"><input type="checkbox" name="disputed" ${d.disputed?'checked':''}>An account or amount in the report may be incorrect.</label><label class="check-option"><input type="checkbox" name="recentPayment" ${d.recentPayment?'checked':''}>I have made a recent payment or received a lender offer.</label><div class="field space-top"><label for="context">What has changed for you? <span class="optional">Optional</span></label><textarea name="context" id="context" maxlength="1000" placeholder="For example: income has reduced, a health expense arose, or I have funds to discuss a closure.">${esc(d.context||'')}</textarea></div></section><div class="btn-row mobile-stack"><button type="submit" class="btn primary">View my draft resolution plan ${icon('arrow','sm')}</button>${link('Back to my summary','summary','btn secondary','')}</div><p class="fine space-top">These are self-reported details, not verified affordability or an agreed payment. Entries are held only in this page session and are cleared on refresh.</p></div><aside class="sticky-card"><section class="card budget-card"><div class="eyebrow">YOUR MONTHLY PICTURE</div><h3>Room in your budget</h3><div id="budget-lines"></div><div class="budget-total"><small id="budget-label">Illustrative amount left after the above</small><div id="budget-remaining" class="big">Not calculated yet</div><p id="budget-note">Enter your current monthly figures. This is an arithmetic snapshot, not a recommended repayment amount.</p></div><p class="fine">Lender terms, other commitments and any changing circumstances still need review. We do not calculate a debt-free date from these figures.</p></section><div class="callout space-top">${icon('heart','sm')}<div><strong>It is okay if there is nothing left.</strong>Your next step can be explaining your circumstances and requesting support.</div></div></aside></div></form>`;}
function updateBudget(){const box=document.getElementById('budget-lines');if(!box)return;const d=state.situationDraft;const b=budgetValues(d);box.innerHTML=[['income','Take-home income'],['essentials','Essential expenses'],['commitments','Existing commitments'],['buffer','Protected buffer']].map(([k,t])=>`<div class="budget-line"><span>${t}</span><strong>${d[k]!==''&&d[k]!==undefined?money(d[k]):'Not entered'}</strong></div>`).join('');document.getElementById('budget-remaining').textContent=d.noPay?'No payment capacity declared':b.remaining===null?'Not calculated yet':money(b.remaining)+' / month';document.getElementById('budget-label').textContent=d.noPay?'Your stated situation':'Illustrative amount left after the above';document.getElementById('budget-note').textContent=d.noPay?'We will prioritise understanding your circumstances and preparing a support discussion. No payment promise is created.':!b.complete?'Complete the four monthly amounts to see a basic snapshot. Blank entries are not treated as zero.':b.raw<0?'Your stated outgoings exceed your income by '+money(Math.abs(b.raw))+'. A human review should come before any new payment commitment.':b.raw===0?'Your stated figures leave no uncommitted monthly amount. Begin with a support-led review, rather than a new payment commitment.':'This is an arithmetic balance, not a recommended repayment. Your actual capacity may be lower.';document.querySelectorAll('[data-monthly="true"]').forEach(el=>el.required=!d.noPay);}
function captureSituation(){const f=document.getElementById('situation-form');if(!f)return;const fd=new FormData(f);state.situationDraft=Object.fromEntries(fd.entries());for(const key of ['noPay','disputed','recentPayment'])state.situationDraft[key]=fd.has(key);}
function planStep(n,id,title,text,links,action){return `<section class="card plan-step ${state.checks[id]?'step-complete':''}"><div class="plan-number">${n}</div><div class="plan-body"><h3>${title}</h3><p>${text}</p>${links?`<div class="plan-links">${links}</div>`:''}<div class="plan-action">${action}<label><input type="checkbox" data-check="${id}" ${state.checks[id]?'checked':''}>Reviewed by me</label></div></div></section>`;}
function accountChip(a){return `<a class="account-chip" href="#/account?id=${a.id}">${esc(a.name)} &middot; ${a.last} ${icon('chevron','sm')}</a>`;}
function planPage(){const d=state.situation;const b=d?budgetValues(d):null;const noFunds=d&&(d.noPay||b.remaining===0);const urgent=d&&(d.notice==='yes'||d.notice==='unsure');let n=1;let steps='';if(urgent){steps+=planStep(n++,'urgent','Review the notice or deadline with a person',`You ${d.notice==='yes'?'reported receiving a notice or time-sensitive deadline':'are unsure whether a notice or deadline needs attention'}. A qualified professional should review it. This draft does not decide legal rights, deadlines or payment obligations.`,null,link('Prepare a support request','support?reason=notice','text-link'));}steps+=planStep(n++,'verify',d?.disputed?'Resolve the disputed details before deciding':'Confirm the current balances and account ownership','Reconcile the IDFC FIRST and Shriram amounts, check the possible transfer from Poonawalla, and obtain the missing Axis card balance. Any recent payment also needs to be reflected.',accountChip(getAccount('account-4'))+accountChip(getAccount('account-3'))+accountChip(getAccount('account-9')),link('Review the reported accounts','accounts','text-link'));steps+=planStep(n++,'initial','Begin discussions with Kisetsu Saison and ICICI','Neither record shows a write-off marker, but both show 593 days past due. Ask for updated statements and available arrangements. This is a starting point for discussion, not an instruction to pay these accounts first.',A.filter(a=>a.group==='review').map(accountChip).join(''),link('Open these 2 accounts','accounts?filter=review','text-link'));steps+=planStep(n++,'parallel','Review the six write-off records in parallel',noFunds?'Explain that you currently have no available payment capacity. Ask the lenders to confirm their records and any support or resolution options; do not promise an unaffordable amount.':'Request current dues and assess the repayment or settlement terms, if any, that lenders will offer. Compare terms against your circumstances before allocating funds.',null,link('View the 6 records','accounts?filter=writeoff','text-link'));steps+=planStep(n++,'monitor','Keep the currently non-overdue account under review','The Axis card ending 9197 shows no overdue, but its balance is blank. Check the latest statement so that missing information is not mistaken for zero debt.',accountChip(getAccount('account-9')),link('View Axis card','account?id=account-9','text-link'));steps+=planStep(n++,'terms','Decide only after the terms are confirmed','Before agreeing, review the written amount, due dates, lender reporting treatment and the documentation you should receive. Payment order remains open until current dues, affordability and actual offers are known.',null,link('Get help reviewing terms','support?reason=terms','text-link'));return `${heading('YOUR WAY FORWARD','Your draft resolution plan.',d?'Built around your report and the situation you shared. Nothing has been agreed with a lender.':'Start with the report findings. Add your situation before deciding what is affordable.',`<button class="btn secondary small" data-action="download-plan">${icon('download','sm')}Save plan</button>`)}<div class="flow-status"><span class="done">${icon('circleCheck','sm')}Report available</span><span class="separator"></span><span class="${d?'done':'current'}">${icon(d?'circleCheck':'situation','sm')}Your details ${d?'added':'needed'}</span><span class="separator"></span><span class="current">${icon('plan','sm')}Draft review plan</span><span class="separator"></span><span>Lender confirmation pending</span></div><div class="card plan-banner"><div><div class="eyebrow">${noFunds?'SUPPORT-LED NEXT STEPS':d?'A STARTING POINT, NOT A PAYMENT SCHEDULE':'ONE IMPORTANT STEP IS STILL MISSING'}</div><h2>${noFunds?'Start with support, not a payment promise.':d?'First verify. Then discuss. Then decide.':'Let&rsquo;s understand what you can manage.'}</h2><p>${noFunds?'Your stated position leaves no monthly payment capacity. Explain your situation, check the lender records and seek human guidance before making a commitment.':d?'The steps below organise your lender reviews. They do not assume that a lender will approve an arrangement or predict a settlement amount.':'We have enough information to identify questions for lenders, but not enough to suggest an affordable payment. Add your income, expenses and current circumstances.'}</p>${!d?`<div class="space-top">${link('Add my situation','situation','btn primary small')}</div>`:''}</div>${badge('Draft &middot; not approved','amber')}</div><div class="plan-columns"><div>${steps}<p class="fine">The checklist records what you have reviewed in this preview. It does not mark an account resolved, a balance verified or a lender contacted.</p><div class="btn-row space-top mobile-stack"><button class="btn secondary" data-action="download-plan">${icon('download','sm')}Save this draft as text</button><button class="btn secondary" data-action="print">${icon('print','sm')}Print this page</button></div></div><aside class="sticky-card"><section class="card pad"><div class="eyebrow">WHAT WE KNOW</div><h3 style="margin-top:12px">Your plan, at a glance</h3><div class="status-list"><div class="status-row"><span>Credit report</span><span class="confirmed">5 Nov 2026 snapshot</span></div><div class="status-row"><span>Your situation</span><span>${d?'Self-reported':'Not yet provided'}</span></div><div class="status-row"><span>Monthly amount left</span><span>${d?(noFunds?(d.noPay?'No capacity declared':'No monthly surplus'):b.remaining===null?'Not calculated':money(b.remaining)):'Not calculated'}</span></div><div class="status-row"><span>One-time funds</span><span>${d&&d.oneoff!==''&&d.oneoff!==undefined?money(d.oneoff):'Not confirmed'}</span></div><div class="status-row"><span>Current lender dues</span><span>Not confirmed</span></div><div class="status-row"><span>Repayment / settlement terms</span><span>Not confirmed</span></div><div class="status-row"><span>Payment order</span><span>Not decided</span></div></div>${link('Edit my situation','situation','text-link','arrow')}<p class="fine space-top">Any monthly figure is an arithmetic snapshot from your entries, not a payment recommendation.</p></section><section class="reassurance space-top">${icon('help','lg')}<h3>A person can help<br>with the next step.</h3><p>Prepare a review request with your questions and account details.</p>${link('Ask for a human review','support?reason=plan','btn primary','arrow')}<p class="fine" style="margin-top:10px">Request preview only. No message is sent.</p></section></aside></div>`;}
function supportPage(){const q=routeInfo().query;const a=getAccount(q.get('account'));const s=state.support;const reason=q.get('reason');const suggested=a?`I need help understanding ${a.name}, account ending ${a.last}.`:reason==='notice'?'I have a notice or deadline that needs human review.':reason==='terms'?'I would like help understanding the written lender terms.':reason==='plan'?'I would like a human review of my draft resolution plan.':'';return `${heading('YOU DO NOT HAVE TO DO THIS ALONE','Let&rsquo;s work through the next step.','Prepare your questions for the Relive team, or find a simple explanation below.')}<div class="support-grid"><section class="card form-card"><div class="eyebrow">SUPPORT REQUEST PREVIEW</div><h2 style="margin-top:12px">What would you like help with?</h2><p>No information will be sent from this prototype.</p><form id="support-form"><fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">Choose the type of support</legend>${[['plan','Understand my options','Help me review the report and the steps I could take.'],['lender','Prepare a lender discussion','Help me ask the right questions about a specific account.'],['notice','Review a notice or disputed detail','A time-sensitive issue or incorrect information needs attention.']].map(([v,t,desc])=>`<label class="support-choice"><input type="radio" name="helpType" value="${v}" ${(s.helpType||(reason==='notice'?'notice':a?'lender':'plan'))===v?'checked':''} required><span><h3>${t}</h3><p>${desc}</p></span></label>`).join('')}</fieldset><div class="field space-top"><label for="support-account">Account to discuss</label><select id="support-account" name="account"><option value="all">My overall debt situation</option>${A.map(x=>`<option value="${x.id}" ${(a?.id||s.account)===x.id?'selected':''}>${esc(x.name)} &middot; ${x.last}</option>`).join('')}</select></div><div class="field"><label for="support-question">Your question</label><textarea name="question" id="support-question" maxlength="1500" required placeholder="Describe what you need help understanding.">${esc(s.question||suggested)}</textarea></div><div class="fields-two"><div class="field"><label for="contact-time">Preferred time to speak</label><select id="contact-time" name="time" required><option value="">Choose a preference</option>${['Morning','Afternoon','Evening','No preference'].map(v=>`<option ${s.time===v?'selected':''}>${v}</option>`).join('')}</select><small>A preference, not a confirmed appointment.</small></div><div class="field"><label for="contact-language">Preferred language</label><select id="contact-language" name="language" required><option value="">Choose a preference</option>${['English','Hindi','Marathi','Other'].map(v=>`<option ${s.language===v?'selected':''}>${v}</option>`).join('')}</select><small>Language support would be confirmed by the team.</small></div></div><div class="uploadbox">${icon('upload','sm')} &nbsp; Add a statement, offer or notice for the preview.<label class="sr-only" for="support-files">Select files for local preview</label><input type="file" id="support-files" multiple accept=".pdf,.png,.jpg,.jpeg,.txt"><p class="fine" style="margin-top:8px">Only filenames are shown. File contents are not read or uploaded. Avoid real personal documents when sharing this prototype.</p><div class="filelist" id="support-filelist">${state.supportFiles.map(esc).join('<br>')}</div></div><label class="consent"><input name="contactConsent" type="checkbox" required><span>I would like the Relive team to review my question and contact me about it. This checkbox is a preview only.</span></label><button class="btn primary full" type="submit">Preview my review request ${icon('arrow','sm')}</button><p class="fine space-top">No request, attachment, appointment or callback is created. No service fees or lender offers are quoted here.</p></form></section><aside><section class="card pad faq"><div class="eyebrow">CLEAR ANSWERS</div><h3 style="margin:12px 0 5px">Before you take the next step</h3><details><summary>Is the outstanding amount what I must pay today?</summary><p>No current payment amount has been confirmed in this preview. These are values from the supplied report. Ask the lender for the latest statement and the terms of any proposed arrangement.</p></details><details><summary>Why start with accounts without a write-off marker?</summary><p>They are starting points for checking available repayment arrangements. Their reported delays are still substantial. This is not an unconditional rule about which debt to pay first.</p></details><details><summary>What should I do with a write-off record?</summary><p>Do not treat the label as proof that nothing remains payable. Ask the lender to confirm the current position and any options it will consider.</p></details><details><summary>Can Relive guarantee a settlement or score increase?</summary><p>No. A report alone does not confirm a lender offer, approval, savings amount or future score. Any repayment or settlement arrangement needs lender confirmation.</p></details><details><summary>What if I cannot afford a payment?</summary><p>Tell us in My situation. The draft can focus on understanding your circumstances, verifying the report and preparing a support discussion rather than assuming payment capacity.</p></details><details><summary>What happens to information I enter here?</summary><p>This prototype makes no network requests. Form entries and filenames stay in this page session and are cleared on refresh. A text export includes the details you choose to enter, so keep it private.</p></details></section><div class="callout amber space-top">${icon('warning','sm')}<div><strong>A legal notice needs human attention.</strong>This preview is not legal advice and does not confirm or extend a deadline. Seek qualified advice about any notice you have received.</div></div></aside></div>`;}
function confirmationPage(){return `<section class="card confirmation"><div class="confirmation-icon">${icon('check','lg')}</div><div class="eyebrow" style="justify-content:center">PREVIEW COMPLETE &middot; NOTHING SENT</div><h1 tabindex="-1">Your review request<br>is ready to discuss.</h1><p>This is the confirmation screen the customer would see after a request. In this prototype, no request has been sent and no callback has been scheduled.</p><div class="callout space-top" style="text-align:left">${icon('chat','sm')}<div><strong>Your question</strong>${esc(state.support.question||'A review of my debt situation and available next steps.')}</div></div><div class="btn-row">${link('Return to my plan','plan','btn primary')}${link('Edit the request','support','btn secondary','')}</div></section>`;}
function dataNote(){return `<p><strong>Source:</strong> the supplied customer credit-bureau JSON, report dated 5 November 2026. This is not a newly retrieved report.</p><p>The bureau summary reports <strong>${money(D.reportedTotal)}</strong>. The sum of nonblank account balances is <strong>${money(1286649)}</strong>. The ${money(1)} difference is preserved, not silently corrected.</p><p>There are 13 records, 10 reported as active and 3 closed. Nine records show overdue amounts; six of those carry a write-off marker. Active does not mean paying regularly. Missing balances and monthly-payment amounts are not treated as zero.</p><p>Possible transferred entries remain separate source records, with a verification warning. Current ownership, current dues and lender offers still need confirmation.</p><p class="fine">This file excludes PAN, contact details, date of birth, address, raw applicant records and report transaction identifiers. It retains first name and masked account endings for the layout.</p>`;}
function modal(title,body){const dialog=document.getElementById('modal');dialog.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-btn" data-action="modal-close" aria-label="Close dialog">${icon('close','sm')}</button></div><div class="dialog-body">${body}</div>`;dialog.showModal();}
function lenderMessage(a){const intro=`Dear ${a.name} team,\n\nPlease help me review my ${a.kind.toLowerCase()} account ending ${a.last}. My credit report dated 5 November 2026 shows a reported balance of ${money(a.balance)} and overdue of ${money(a.overdue)}.\n\n`;let extra='Please provide an up-to-date statement, a breakdown of the amount due, and the repayment or resolution options you are currently able to consider. I would also like to understand how any agreed arrangement would be recorded and reported.\n\n';if(a.group==='transfer'||a.last==='1370')extra='Please confirm who currently owns this debt, provide the relevant transfer details and an up-to-date statement explaining the balance and overdue amounts.\n\n';if(a.balance===null)extra='The current-balance field is missing in my credit report. Please provide the latest statement and confirm the current balance and payment requirements.\n\n';return intro+extra+'I will review my current finances and any written terms before making a payment commitment. This request does not confirm agreement to a reported balance or proposed arrangement.\n\nThank you.';}
function downloadText(text,filename){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadPlan(){const d=state.situation,b=d?budgetValues(d):null;let text='RELIVE BY CGREEN - DRAFT REVIEW PLAN\nInteractive design prototype - not a lender-approved payment plan\nSource: supplied credit-bureau report dated 5 November 2026\n\nREPORT FACTS\nScore: 602\nReported outstanding (bureau summary): '+money(D.reportedTotal)+'\nAccount balances total: '+money(1286649)+' (source difference of '+money(1)+')\n13 records; 9 with overdue; 6 of the 9 with write-off records.\n\n';text+='YOUR SITUATION\n'+(d?`Take-home income: ${money(d.income)}\nEssential expenses: ${money(d.essentials)}\nExisting commitments: ${money(d.commitments)}\nProtected buffer: ${money(d.buffer)}\nIllustrative monthly amount left: ${b.remaining===null?'Not calculated':money(b.remaining)}\nNo capacity declared: ${d.noPay?'Yes':'No'}\nOne-time amount: ${money(d.oneoff)}\nNotice or deadline: ${d.notice}\nOther commitments: ${d.otherDebts||'Not supplied'}\nContext: ${d.context||'Not supplied'}\n`:'Not yet provided. Affordability cannot be established.\n');text+='\nSUGGESTED REVIEW STEPS - NOT PAYMENT PRIORITY\n';if(d&&(d.notice==='yes'||d.notice==='unsure'))text+='- Seek human review of any notice or deadline before deciding next steps.\n';text+='- Confirm current lender balances and any recent payment.\n- Reconcile the IDFC FIRST personal-loan amount and the Shriram amount.\n- Verify the possible Poonawalla / Shriram transfer; do not create duplicate payment tasks.\n- Obtain the missing current balance for Axis card ending 9197.\n- Begin lender discussions for Kisetsu Saison and ICICI, while reviewing six write-off records in parallel.\n- Compare only written, confirmed lender terms against your actual circumstances.\n\n';text+='No lender has been contacted. No payment, settlement, approval, savings or score change is confirmed. This prototype does not provide legal advice. Keep this export private.\n';downloadText(text,'Relive_Draft_Review_Plan.txt');toast('Draft text saved. It is not a confirmed payment plan.');}
async function copyMessage(){const el=document.getElementById('lender-message');if(!el)return;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(el.value);}else{el.focus();el.select();if(!document.execCommand('copy'))throw new Error('Clipboard unavailable');}toast('Message copied. Review it before sending to your lender.');}catch(e){el.focus();el.select();toast('Select the message and copy it using your browser.');}}
function render(){pageTimers.forEach(clearTimeout);pageTimers=[];const {path}=routeInfo();const views={report:requestPage,loading:loadingPage,summary:summaryPage,accounts:accountsPage,account:accountPage,situation:situationPage,plan:planPage,support:supportPage,confirmation:confirmationPage};document.getElementById('app').innerHTML=chrome((views[path]||summaryPage)());if(window.RELIVE_LOGO){document.querySelectorAll('.brandmark').forEach(el=>el.src=window.RELIVE_LOGO);}document.title=`Relive | ${{report:'Your credit report',summary:'My summary',accounts:'My accounts',account:'Account details',situation:'My situation',plan:'My resolution plan',support:'Help & guidance'}[path]||'Your way forward'}`;window.scrollTo({top:0,behavior:'instant'});const title=document.querySelector('h1');if(title)title.focus({preventScroll:true});if(path==='situation')updateBudget();if(path==='loading'){[350,850,1350].forEach((t,i)=>pageTimers.push(setTimeout(()=>{const el=document.getElementById('load-'+i);if(el){el.classList.add('done');el.querySelector('.check-circle').innerHTML=icon('check','sm');document.querySelector('.progress-fill').style.width=(i+1)/3*100+'%';document.querySelector('.progress').setAttribute('aria-valuenow',String(Math.round((i+1)/3*100)));}},t)));pageTimers.push(setTimeout(()=>go('summary'),1950));}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='skip'){e.preventDefault();document.getElementById('main-content').focus();}else if(action==='menu'){document.getElementById('sidebar').classList.add('open');document.getElementById('mobile-overlay').classList.add('open');el.setAttribute('aria-expanded','true');}else if(action==='menu-close'){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobile-overlay').classList.remove('open');document.querySelector('.menu-toggle')?.setAttribute('aria-expanded','false');}else if(action==='restart'){state.goal='';state.story='';state.consent=false;state.situation=null;state.situationDraft={};state.checks={};state.support={};state.supportFiles=[];state.requestPreviewed=false;state.startTab='review';go('report');}else if(action==='privacy'){modal('About your information',`<p>This prototype uses the report already supplied. It makes no bureau, AI, lender, analytics or messaging requests.</p><p>Income, expenses and other form entries stay in this page session and disappear on refresh. Selected documents are not read or uploaded. Downloads you create stay on your device.</p><p>For a live service, the consent notice must explain the purpose, data recipients, third-party AI processing where applicable, retention and customer choices. The sample checkbox is not a substitute for that notice.</p>`);}else if(action==='data-note'){modal('What this screen is based on',dataNote());}else if(action==='modal-close'){document.getElementById('modal').close();}else if(action==='start-tab'){state.startTab=el.dataset.group;document.querySelectorAll('[data-action="start-tab"]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));document.getElementById('start-panel').innerHTML=startSection(state.startTab);}else if(action==='account-filter'){go('accounts?filter='+el.dataset.filter);}else if(action==='message'){const a=getAccount(el.dataset.id);modal('A message to your lender',`<p>This is a draft for ${esc(a.name)}, account ending ${a.last}. Check it before using it. Nothing will be sent from this page.</p><label class="sr-only" for="lender-message">Draft lender message</label><textarea id="lender-message">${esc(lenderMessage(a))}</textarea><div class="btn-row"><button class="btn primary" data-action="copy-message">${icon('copy','sm')}Copy message</button><button class="btn secondary" data-action="download-message" data-id="${a.id}">${icon('download','sm')}Save text</button></div>`);}else if(action==='copy-message'){await copyMessage();}else if(action==='download-message'){const a=getAccount(el.dataset.id);downloadText(document.getElementById('lender-message').value,`Relive_Lender_Message_${a.last}.txt`);toast('Draft message saved. Nothing has been sent.');}else if(action==='download-plan'){downloadPlan();}else if(action==='print'){window.print();}});
document.addEventListener('input',e=>{if(e.target.id==='account-search'){const list=accountList(e.target.dataset.filter,e.target.value);document.getElementById('account-results').innerHTML=list.html;document.getElementById('result-count').textContent=`Showing ${list.count} of 13 report records - grouped by suggested review, not payment order`;}if(e.target.closest('#situation-form')){captureSituation();updateBudget();}if(e.target.closest('#report-form')){const fd=new FormData(document.getElementById('report-form'));state.goal=fd.get('goal')||'';state.story=fd.get('story')||'';state.consent=fd.has('consent');}if(e.target.closest('#support-form')&&e.target.type!=='file'){state.support=Object.fromEntries(new FormData(document.getElementById('support-form')).entries());}});
document.addEventListener('change',e=>{if(e.target.id==='support-files'){state.supportFiles=Array.from(e.target.files).map(f=>f.name);document.getElementById('support-filelist').innerHTML=state.supportFiles.map(esc).join('<br>');}if(e.target.dataset.check){state.checks[e.target.dataset.check]=e.target.checked;e.target.closest('.plan-step').classList.toggle('step-complete',e.target.checked);}if(e.target.closest('#situation-form')){captureSituation();updateBudget();}});
document.addEventListener('submit',e=>{if(e.target.id==='report-form'){e.preventDefault();const fd=new FormData(e.target);state.goal=fd.get('goal');state.story=fd.get('story');state.consent=fd.has('consent');go('loading');}else if(e.target.id==='situation-form'){e.preventDefault();captureSituation();state.situation={...state.situationDraft};go('plan');}else if(e.target.id==='support-form'){e.preventDefault();state.support=Object.fromEntries(new FormData(e.target).entries());state.requestPreviewed=true;go('confirmation');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('mobile-overlay')?.classList.remove('open');document.querySelector('.menu-toggle')?.setAttribute('aria-expanded','false');}});
window.addEventListener('hashchange',render);
render();

</script>
</body>
</html>
