function home(){S.product='relive';return pub(`<section class="hero"><div class="wrap"><div class="hero-top"><div class="eyebrow"><span class="dot"></span>Your loan problem. A way forward.</div></div><div class="hero-grid"><div><section id="carousel" aria-roledescription="carousel" aria-label="Loan problems we can help you review"><div id="poster-slot">${poster()}</div><div class="carousel-controls"><div class="carousel-dots" id="carousel-dots">${dots()}</div><span class="carousel-count" id="carousel-count">01 / 06</span>${btn('prev',icon('back'),'round-btn','','aria-label="Previous message"')}${btn('pause-carousel',icon('pause'),'round-btn','','id="carousel-pause" aria-label="Pause slideshow"')}${btn('next',icon('arrow'),'round-btn','','aria-label="Next message"')}</div></section></div><div class="card help-card"><div class="eyebrow">How can we help you?</div><h2>Start with your story.<br>We are here to listen.</h2><p>Overdue dues, a loan you want to settle, or an account that does not look right? Tell us what is worrying you.</p><div class="voice-cue">${wave()}<div><strong>In your own words.</strong><div class="small muted">Speak, type or ask for a conversation.</div></div></div>${start('Tell us my problem','relive','concern','btn full','mic')}${start('Speak to us','relive','callback','btn secondary full','phone')}<div class="alternatives">${start('Prefer to type?','relive','concern/type','text-btn','')}${start('View my case','relive','relive-dashboard','text-btn','')}</div><p class="fine">Start with your mobile number. We will ask for the details relevant to your request.</p></div></div><div class="under-hero"><span>${icon('check')}No need to know the solution yet</span><span>${icon('mic')}Voice-first support</span><span>${icon('shield')}Your choices, explained</span></div></div></section>${impactSection(false)}<section class="section"><div class="wrap"><div class="thrive-strip"><div><div class="mini-brand">thrive &#8599;</div><h3 style="margin-top:8px">Several EMIs. One monthly budget.</h3><p>Explore whether consolidation could make your repayments easier to manage.</p></div>${link('thrive','Explore Thrive','btn secondary','arrow')}</div></div></section><section class="section" style="padding-top:0"><div class="wrap"><div class="section-head"><div><div class="eyebrow">How we help</div><h2>Find your situation.<br>Start where you are.</h2></div><p class="muted">Your concern comes first. We do not start by prescribing the same answer to everyone.</p></div><div class="grid3">${C.concerns.slice(0,6).map(serviceCard).join('')}</div></div></section><section class="section" style="background:#eef3e8"><div class="wrap"><div class="section-head"><div class="eyebrow">How it works</div><h2>A conversation. A plan.<br>A practical next step.</h2></div>${steps()}</div></section><section class="section"><div class="wrap"><div class="grid2"><div class="card"><div class="icon-box">${icon('shield')}</div><h3 style="margin-top:20px">Know your rights.</h3><p class="muted">Understand fair recovery, microfinance protections and how to raise a concern.</p>${link('rights','Explore Your Rights','text-btn','arrow')}</div><div class="card"><div class="icon-box">${icon('file')}</div><h3 style="margin-top:20px">Know your options.</h3><p class="muted">Clear explanations of settlement, repayments and account corrections.</p>${link('information','Visit Information','text-btn','arrow')}</div></div></div></section><section class="section" style="padding-top:0"><div class="wrap">${callout()}</div></section>`);}
function poster(){const s=C.slides[S.slide];return `<div class="poster"><img class="poster-photo" src="${M[s.image]}" alt="" draggable="false"><div class="poster-text"><div class="poster-label">${s.tag}</div><h1>${s.title}</h1><p>${s.body}</p><span class="tag">${s.pill}</span></div></div>`;}
function dots(){return C.slides.map((s,i)=>`<button class="carousel-dot ${S.slide===i?'active':''}" data-action="slide" data-index="${i}" aria-label="Message ${i+1}: ${esc(s.tag)}" ${S.slide===i?'aria-current="true"':''}></button>`).join('');}
function steps(){return `<div class="steps">${[['01','Tell us what is happening.','Sign in, speak or type. A short explanation is enough to begin.'],['02','Review the way forward.','Confirm what we understood and share the relevant details.'],['03','Take the next step with support.','Review proposed actions, authorise any lender contact and track your request.']].map(([n,h,p])=>`<div><div class="step-num">${n}</div><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`;}
function serviceCard(c){return `<a class="card clickable" href="#/service/${c.id}"><div class="icon-box">${icon(c.icon)}</div><h3>${c.name}</h3><p>${c.description}</p><span class="text-btn">How we can help ${icon('arrow')}</span></a>`;}
function thriveLanding(){S.product='thrive';return pub(`<section class="hero" style="padding-bottom:48px"><div class="wrap"><div class="hero-grid"><div class="product-intro"><div class="eyebrow"><span class="dot"></span>Thrive by CGreen</div><h1>Several EMIs.<br>One monthly budget.<br><em>Let us simplify it.</em></h1><p class="lead">Different loans. Different due dates. Explore whether bringing eligible repayments together could make them easier to manage.</p><p class="muted" style="margin-top:18px;max-width:490px">Tell us what you want to change. We will review the next step with you, not promise an offer before understanding your situation.</p><div class="emi-illustration" aria-label="Review several repayment commitments together"><div class="emi-chip">${icon('wallet')}Loan 1</div><div class="emi-chip">${icon('wallet')}Loan 2</div><div class="emi-chip">${icon('receipt')}Card dues</div><span>${icon('arrow')}</span><div class="emi-chip target">A clearer repayment plan</div></div><p class="footnote">Consolidation depends on affordability, eligible accounts and lender approval. A lower EMI need not mean a lower total cost.</p></div><div>${loginPanel('thrive',true)}</div></div></div></section><section class="section" style="background:white;border-top:1px solid var(--line)"><div class="wrap"><div class="section-head"><div><div class="eyebrow">What would you like to change?</div><h2>Make the goal yours.</h2></div></div><div class="grid3">${[['wallet','Bring repayments together','Review eligible loans and understand whether fewer repayment dates could help.'],['calendar','Explore a manageable EMI','Share your preferred monthly commitment and look at fees, tenure and total cost.'],['phone','Get a conversation, not a guess','Explain your priorities. Our review begins with your circumstances.']].map(([i,h,p])=>`<div class="card"><div class="icon-box">${icon(i)}</div><h3 style="margin-top:18px">${h}</h3><p class="muted">${p}</p></div>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="thrive-strip"><div><div class="eyebrow">One connected journey</div><h3>Something needs resolving first?</h3><p>If an overdue or disputed account needs attention, we guide you to Relive and keep your original consolidation goal. No second login.</p></div>${link('relive','Meet Relive','btn secondary','arrow')}</div></div></section>`);}
function loginPanel(product,landing=false){const t=product==='thrive';return `<div class="card auth-card"><div class="auth-steps"><b>1. Your number</b><span>&rarr; 2. Verify</span><span>&rarr; 3. Your next step</span></div><h2>${S.pending==='callback'?'Let us arrange a conversation.':t?'Let us start with you.':'Let us start helping you.'}</h2><p class="muted">Enter your mobile number so we can keep your request together and contact you about the help you need.</p><form id="login-form" data-product="${product}" data-landing="${landing}"><div class="field"><label for="mobile">Your mobile number</label><div class="phone-input"><span>+91</span><input id="mobile" name="mobile" inputmode="numeric" autocomplete="tel-national" maxlength="10" pattern="[0-9]{10}" value="${esc(S.mobile)}" aria-describedby="mobile-hint" required></div><small id="mobile-hint">Private demo number: 1234567891. No SMS is sent.</small></div><div id="login-error" class="error" role="alert"></div><button class="btn full" type="submit">${t?'Continue with Thrive':'Send verification code'} ${icon('arrow')}</button></form><p class="footnote">We send a one-time code to verify access to your number in the live service. This prototype uses a demonstration code.</p><div class="divider"></div><p class="small muted">${t?'Already using Relive? Use the same number.':'You can speak to a person without completing the assessment.'}</p>${t?start('Prefer a callback?','thrive','callback','text-btn','phone'):''}<p class="tiny muted" style="margin-top:15px">${link('privacy','How we use your information','text-btn')} &middot; ${link('terms','Terms','text-btn')}</p></div>`;}
function authPage(product){S.product=product;return pub(`<section class="auth-layout"><div class="auth-copy"><div class="eyebrow">${product==='thrive'?'Thrive':'Relive'} by CGreen</div><h1>${product==='thrive'?'Multiple EMIs?<br>Let us explore<br>a simpler way.':S.pending==='callback'?'Prefer a person?<br>Let us talk.':'A loan problem?<br>Start by telling us.'}</h1><p class="lead">${product==='thrive'?'Give us a little information to help us understand what you want to change about your repayments.':'You do not have to know the solution. Tell us what is happening, and we will help you work out where to start.'}</p><div class="under-hero"><span>${icon('check')}Only the details we need</span><span>${icon('phone')}Human support available</span></div></div>${loginPanel(product)}</section>`);}
function otpPage(){return pub(`<section class="section"><div class="narrow" style="max-width:540px"><div class="card auth-card"><div class="auth-steps"><span>1. Your number</span><b>2. Verify</b><span>3. Your next step</span></div><div class="icon-box">${icon('lock')}</div><h2 style="margin-top:23px">One small step.<br>Then tell us what you need.</h2><p class="muted">Verify access to the demo number ending <strong>${esc(S.mobile.slice(-4))}</strong>.</p><form id="otp-form"><div class="field"><label for="otp">Verification code</label><input class="otp" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="------" required><small>For this private prototype, enter <strong>123456</strong>. No OTP has been sent.</small></div><div id="otp-error" class="error" role="alert"></div><button class="btn full" type="submit">Verify &amp; continue ${icon('arrow')}</button></form><div class="stack" style="margin-top:20px">${link('login/'+S.product,'Change number','text-btn')}${btn('resend','Resend code','text-btn')}</div><p class="footnote">This step does not create a payment commitment or authorise lender contact.</p></div></div></section>`);}
function permission(){return app(`${appTitle('Information you already shared','Use the sample report to review your next step.','This demo uses the report already supplied for this design. It does not retrieve a new report.')}<div class="flow-layout"><div class="card"><h3>Shakti Yadav &middot; 5 November 2026</h3><p class="muted" style="margin-top:14px">Experian-style formatted Bureau(A) V2 report supplied in this conversation.</p><div class="divider"></div><p>We will use the account amounts, dates and repayment indicators to prepare a report-based review for ${S.origin==='thrive'?'your Thrive enquiry':'your Relive request'}.</p><label class="check"><input type="checkbox" id="source-consent">I want to use this supplied sample report for this demonstration and understand that this is not a live report retrieval.</label>${btn('use-report','Use sample report & continue','btn','arrow')}<p class="footnote">The demonstration mobile number is not an identity match from the report. Production access requires authenticated ownership, appropriate purpose-specific permission and access controls.</p></div><aside class="flow"><div class="card soft"><h3>Prefer to talk first?</h3><p class="muted">You do not need to review the report to request a conversation.</p>${link('callback','Request a callback','text-btn','phone')}</div>${note('Permission to review information is separate from permission to approach a lender or publish a resolution.','plain')}</aside></div>`);}
function concernPage(){return app(`${appTitle('Tell us what is happening','How can we help you today?','Choose the concerns that fit, or tell us in your own words. You can select more than one.')}<div class="flow-layout"><div class="card"><div class="choice-grid">${C.concerns.map(c=>`<label class="choice"><input type="checkbox" name="concern" value="${c.id}" ${S.concerns.includes(c.id)?'checked':''}><span>${c.name}</span></label>`).join('')}</div><div class="divider"></div><div class="between"><h3>In your own words.</h3><div class="tabs">${['voice','type'].map(m=>btn('method',m==='voice'?'Speak':'Type',S.method===m?'active':'','',`data-method="${m}"`)).join('')}</div></div><p class="small muted" style="margin-top:10px">Explain what happened and what you would like help with. No financial terminology needed.</p>${S.method==='voice'?voiceUI():''}<div class="field"><label for="concern-text">${S.method==='voice'?'Your words or a short note (optional)':'Tell us what is worrying you'}</label><textarea id="concern-text" maxlength="2500" placeholder="For example: I could not pay earlier. I now have some money available and want to understand my options.">${esc(S.message)}</textarea><small>Your note is not a payment promise. Do not include passwords, OTPs or full account numbers.</small></div><div class="form-actions">${btn('confirm-story','Review what I shared','btn','arrow')}${link('callback','I would rather speak to someone','btn secondary','phone')}</div><div id="story-error" class="error" role="alert"></div></div><aside class="flow"><div class="card soft"><div class="icon-box">${icon('mic')}</div><h3 style="margin-top:20px">Your voice is a starting point.</h3><p class="muted">Confirm the summary before any next step. You can correct what is missing.</p></div>${note('In this prototype, recording stays in this browser session. Transcription and AI interpretation are not connected. Use a typed note or ask for a callback.','plain')}<div class="card"><h4>Microfinance or group-loan issue?</h4><p class="small muted">Tell us whether it concerns your instalment, a payment receipt, an amount requested, or recovery conduct.</p></div></aside></div>`);}
function voiceUI(){return `<div class="voice-box"><div class="field" style="margin-top:0"><label for="voice-language">Preferred speaking language</label><select id="voice-language">${['English','Hindi','Marathi','Tamil','Telugu','Kannada','Bengali','Other - request language support'].map(l=>`<option ${S.language===l?'selected':''}>${l}</option>`).join('')}</select><small>Language preference is captured for human support. Automated transcription is not connected.</small></div><label class="check"><input type="checkbox" id="voice-consent" ${S.consentVoice?'checked':''}>I agree to recording my voice note for this request. I can listen to it or delete it before continuing.</label><div id="recorder-display">${wave(recording)}<div class="timer" id="record-timer">${timeFormat(seconds)}</div></div><div class="stack" style="justify-content:center">${btn(recording?'stop-record':'start-record',recording?'Finish recording':'Start recording','btn',recording?'check':'mic')}${recording?btn('pause-record','Pause','btn secondary','pause'):''}${audioURL?btn('delete-record','Delete recording','btn secondary','close'):''}</div>${audioURL?`<audio controls src="${audioURL}" aria-label="Your recorded concern"></audio><p class="footnote">Recording captured locally. It has not been transcribed, uploaded or sent.</p>`:''}<div id="record-error" class="error" role="alert"></div></div>`;}
function confirmPage(){return app(`${appTitle('Confirm your concern','Have we understood you correctly?','Review the concerns and your words below before continuing. No AI transcription is running in this preview.')}<div class="flow-layout"><div class="card"><div class="eyebrow">Your selected concerns</div><div class="badge-row">${S.concerns.length?S.concerns.map(id=>badge(esc(concernName(id)))).join(''):badge('Not sure where to begin','neutral')}</div><div class="field"><label for="confirm-text">Your explanation</label><textarea id="confirm-text" maxlength="2500" placeholder="Add or correct your note here.">${esc(S.message)}</textarea></div>${audioURL?`<audio style="width:100%;margin-top:18px" controls src="${audioURL}"></audio><p class="footnote">Audio remains local and untranscribed; the live team would need access to review it after a separate upload integration.</p>`:''}<label class="check"><input id="disputed" type="checkbox" ${S.disputed?'checked':''}>I believe an account, balance or payment record is incorrect and want it verified before any repayment recommendation.</label><div class="form-actions">${btn('story-correct','Yes, continue','btn','arrow')}${link('concern','Change my concerns','btn secondary')}</div></div><aside class="card soft"><h3>You stay involved.</h3><p class="muted">Your words are customer-reported information, not an admission that every reported amount is correct.</p><div class="divider"></div>${link('callback','Speak to us instead','text-btn','phone')}</aside></div>`);}
function concernName(id){return C.concerns.find(c=>c.id===id)?.short||id;}
function metric(label,val,sub,ic='wallet',word=false){return `<div class="metric"><div class="between"><span class="label">${label}</span>${icon(ic)}</div><div class="value ${word?'word':''}">${val}</div><div class="sub">${sub}</div></div>`;}
function scoreCard(){return `<aside class="score-card"><div><div class="small">Your supplied score</div><div class="score-date">Experian &middot; 05 Nov 2026</div></div><div class="score">602</div><div class="score-caption">Score as supplied. No rating band, current eligibility or score improvement is inferred.</div><div class="mini-list"><span><strong>13</strong> records</span><span><strong>10</strong> active in summary</span><span><strong>3</strong> closed</span></div>${link('report-notes','See source and checks','text-btn','arrow')}</aside>`;}
function summaryCard(origin){const summary=R.assessment(D,origin,S.concerns,S.disputed);return `<section class="assessment"><div class="between"><div class="eyebrow" style="margin:0">${icon('spark')}Relive assessment</div>${badge(S.disputed?'Verification first':'Initial review','neutral')}</div><h2>${S.disputed?'Let us check what does not look right.':origin==='thrive'?'Resolve what needs attention.<br>Then revisit your EMIs.':'Your overdue debt needs<br>a clear next step.'}</h2><p id="assessment-text">${esc(summary)}</p><div class="form-actions">${link(S.disputed?'complaint':origin==='thrive'?'relive-dashboard':'situation',S.disputed?'Review the disputed information':origin==='thrive'?'Continue with Relive':'Build my next steps','btn','arrow')}${link('callback','Speak to us','btn secondary','phone')}</div><div class="assessment-foot">Based on the report supplied for this demo. Reported balances are not live payable amounts or confirmed settlement terms. ${Array.from(summary).length}/500 characters.</div></section>`;}
function reliveDashboard(){S.product='relive';return app(`${appTitle('Your Relive overview',S.disputed?'Let us check the facts together.':'Hello, Shakti. A clearer next step starts here.','We will keep the report facts, your circumstances and any lender-confirmed terms separate.')}${S.origin==='thrive'?note('<strong>Your Thrive goal is saved.</strong> You came to simplify your EMIs. We are reviewing the account issues first; you do not need to sign in again.'):''}<div class="summary-grid">${summaryCard('relive')}${scoreCard()}</div><div class="metrics">${metric('Reported outstanding',money(D.report.outstanding),'From the report summary, not a payment request')}${metric('Accounts with overdue amounts','9','Counted from individual account records','flag')}${metric('With written-off amounts','6','Not a statement that the debt is waived','file')}${metric('Monthly EMI picture','Needs details','Scheduled payment amounts not supplied','calendar',true)}</div><div class="main-aside"><section class="card"><div class="between"><h3>Your next steps</h3>${badge('No payment commitment','neutral')}</div><ol class="step-list"><li><span class="num">1</span><div><h4>Confirm current dues and any errors.</h4><p>Some reported overdue amounts exceed the balances. Clarify the statements before deciding on payment.</p></div></li><li><span class="num">2</span><div><h4>Share what is manageable now.</h4><p>Tell us about essential expenses and any funds available. An unknown amount is not treated as zero.</p></div></li><li><span class="num">3</span><div><h4>Review options with support.</h4><p>No repayment arrangement or settlement offer has yet been confirmed.</p></div></li></ol><div class="stack">${link('situation','Tell us my situation','btn','arrow')}${link('accounts','Review my accounts','text-btn','arrow')}</div></section><aside class="flow"><div class="card soft"><div class="eyebrow">Your concern</div><h3>${S.concerns.length?esc(concernName(S.concerns[0])):'Tell us what matters most.'}</h3><p class="small muted">${S.message?esc(S.message.slice(0,200)):'The report tells part of the story. Your circumstances tell the rest.'}</p>${link('concern','Add or update my concern','text-btn','mic')}</div><div class="card"><h4>Already paid, or an account is not yours?</h4><p class="small muted">Ask for a review. We do not treat a disputed entry as admitted debt.</p>${link('complaint','Explain the issue','text-btn','arrow')}</div></aside></div>`);}
function thriveDashboard(){S.product='thrive';S.origin='thrive';if(!S.goals.length)S.goals=['Combine several repayments'];return app(`${appTitle('Your Thrive review','Let us review your repayment picture.','Your consolidation goal is retained. The same supplied report is used here and in Relive.')}
<div class="routing-banner">${icon('flag')}<div><h3>${S.disputed?'This account information needs verification first.':'Before combining EMIs, let us address the overdue accounts.'}</h3><p>The checked report contains 9 positive overdue amounts. ${S.disputed?'Your dispute needs review before a payment recommendation.':'Relive is the recommended first step, not a loan rejection.'} No second login is needed.</p>${link(S.disputed?'complaint':'relive-dashboard',S.disputed?'Ask for a verification review':'Continue with Relive','text-btn','arrow')}</div></div>
<div class="metrics">${metric('Supplied Experian score','602','Report dated 05 Nov 2026','chart')}${metric('Reported account records','13','10 active and 3 closed in source summary','wallet')}${metric('Monthly scheduled EMIs','Not supplied','No scheduled EMI values in 13 records','calendar',true)}${metric('Accounts needing overdue review','9','Account-level count; not the summary default field','flag')}</div><div class="summary-grid" style="grid-template-columns:minmax(0,1.5fr) minmax(310px,1fr)">${summaryCard('thrive')}<aside class="card"><div class="eyebrow">Your original goal</div><h3>What are you looking to change?</h3><p class="small muted" style="margin-top:14px">Keep your consolidation preferences with the case, even while Relive reviews the overdue position.</p><div class="badge-row">${(S.goals.length?S.goals:['Simplify my monthly repayments']).map(x=>badge(esc(x),'neutral')).join('')}</div><div class="divider"></div>${link('thrive-enquiry','Tell us what I am looking for','btn full','arrow')}<p class="footnote">The callback will be routed to a Relive-first review for this sample. This does not confirm any consolidation eligibility.</p></aside></div><div class="card"><div class="between"><div><div class="eyebrow">Your repayment picture</div><h3>Confirm what you are paying.</h3></div>${link('emi-review','Review all commitments','text-btn','arrow')}</div><p class="small muted" style="margin:13px 0 22px">An outstanding balance is not a monthly EMI. The supplied scheduled-payment fields are blank, so no monthly total has been invented.</p>${emiTable(4)}<div class="divider"></div>${note('Product labels cannot be confirmed from the supplied type codes alone. Keep actual weekly, fortnightly and monthly commitments distinct when collecting your current details.','plain')}</div>`);}
function emiTable(limit=99){return `<div class="table-scroll"><table class="data-table"><thead><tr><th>Account</th><th>Reported balance</th><th>Scheduled monthly EMI</th><th>Current details</th></tr></thead><tbody>${D.accounts.slice(0,limit).map(a=>`<tr><td>Account &bull;&bull;&bull;&bull;${a.last4}<span class="meta">Type ${a.typeCode} &middot; product label unconfirmed</span></td><td class="amount">${money(a.balance)}</td><td><span class="badge neutral">Not supplied</span></td><td>${S.emiValues[a.id]?money(S.emiValues[a.id].amount)+' / '+esc(S.emiValues[a.id].frequency):link('emi-review','Add my current amount','text-btn')}</td></tr>`).join('')}</tbody></table></div>`;}
function accounts(){return app(`${appTitle('My accounts','The facts behind the next step.','Reported amounts are not live dues. Product and status codes remain unlabelled where a confirmed provider dictionary was not supplied.')}<div class="filter-bar"><div class="tabs">${[['all','All 13'],['overdue','Overdue 9'],['writeoff','Write-off amount 6'],['closed','Closure date 3']].map(([v,t])=>btn('filter',t,S.filter===v?'active':'','',`data-filter="${v}"`)).join('')}</div><input class="search" id="account-search" placeholder="Search lender or last 4 digits" aria-label="Search accounts" value="${esc(S.search)}"></div><div id="account-results">${accountTable()}</div><p class="footnote">Lender names appear only inside this private sample case, never in the public resolution feed.</p>`);}
function filteredAccounts(){return D.accounts.filter(a=>(S.filter==='all'||S.filter==='overdue'&&(a.pastDue||0)>0||S.filter==='writeoff'&&(a.writeOff||0)>0||S.filter==='closed'&&a.closed)&&((a.lender+' '+a.last4).toLowerCase().includes(S.search.toLowerCase())));}
function aStatus(a){return a.closed?badge('Closure date reported','neutral'):(a.pastDue||0)>0?badge('Overdue reported','amber'):badge('No overdue reported','neutral');}
function accountTable(){const a=filteredAccounts();return a.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Account / lender</th><th>Reported balance</th><th>Past due</th><th>Review indicator</th><th>Details</th></tr></thead><tbody>${a.map(a=>`<tr><td>${esc(a.lender)}<span class="meta">&bull;&bull;&bull;&bull;${a.last4} &middot; Type code ${a.typeCode}</span></td><td class="amount">${money(a.balance)}</td><td class="amount">${money(a.pastDue)}</td><td>${aStatus(a)}${a.writeOff>0?'<span class="meta">Positive written-off amount</span>':''}</td><td>${link('account/'+a.id,'View','text-btn','arrow')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No matching accounts. Change the filter or search.</div>';}
function accountPage(id){const a=D.accounts.find(x=>x.id===id);if(!a)return notFound();return app(`${appTitle('Account details',esc(a.lender),'Account ending '+a.last4+' | Reported '+a.reported)}${link('accounts','Back to accounts','text-btn','back')}<div class="metrics">${metric('Reported balance',money(a.balance),'A missing balance is not zero')}${metric('Amount past due',money(a.pastDue),'Current lender statement needed','flag')}${metric('Written-off amount',money(a.writeOff),'Do not add this to the balance','file')}${metric('Scheduled monthly EMI','Not supplied','No estimate has been inserted','calendar',true)}</div>${a.balance!==null&&a.pastDue>a.balance?note('The reported overdue amount exceeds the reported balance. Ask for a statement explaining the figures; do not automatically correct either value.','amber'):''}${a.id==='a03'||a.id==='a11'?note('Another record shares the masked suffix, opening date and original amount. A transfer may be involved, but the supplied codes have no decoding legend. Confirm ownership before treating them as separate payable obligations.','plain'):''}<div class="main-aside"><div class="card"><h3>What the source says</h3><div class="facts">${[['Opened',a.opened],['Latest report date',a.reported],['Closure date',a.closed||'Not supplied'],['Latest days past due',a.latestDpd===null?'Not supplied':a.latestDpd],['Account type code',a.typeCode],['Account status code',a.statusCode],['Original loan / highest credit',money(a.originalAmount)],['Source PDF page',a.sourcePage]].map(([k,v])=>`<div class="fact"><small>${k}</small><strong>${esc(v)}</strong></div>`).join('')}</div><details class="details-box"><summary>Reported payment history</summary><div class="details-content"><div class="table-scroll"><table class="data-table"><thead><tr><th>Month</th><th>Days past due</th><th>Source asset code</th></tr></thead><tbody>${a.history.slice(0,18).map(h=>`<tr><td>${h.month}/${h.year}</td><td>${h.daysPastDue??'Not supplied'}</td><td>${esc(h.assetCode)}</td></tr>`).join('')}</tbody></table></div></div></details></div><aside class="flow"><div class="card soft"><h3>A useful next step.</h3><p class="muted">Get the current statement and explain what you would like reviewed. No arrangement has been approved through this report.</p>${link('documents','Add a statement or receipt','btn secondary','upload')}<div style="margin-top:14px">${link('callback','Request a conversation','text-btn','phone')}</div></div><div class="card"><h4>Something is incorrect?</h4><p class="small muted">Describe the discrepancy before considering payment.</p>${link('complaint/'+a.id,'Ask for a review','text-btn','arrow')}</div></aside></div>`);}
function emiReview(){return app(`${appTitle('Confirm your commitments','What are you paying at the moment?','The sample report does not supply monthly EMI amounts. Add your current figures only where you know them.')}<div class="notice plain">${icon('info')}<div>These entries are <strong>customer-reported</strong>, not values from the bureau. Blank stays unknown. Weekly and fortnightly amounts are not silently treated as monthly instalments.</div></div><form id="emi-form" class="card" style="margin-top:23px"><div class="table-scroll"><table class="data-table"><thead><tr><th>Account</th><th>Your current amount</th><th>Repayment frequency</th><th>Product, if you know</th></tr></thead><tbody>${D.accounts.map(a=>{const v=S.emiValues[a.id]||{};return `<tr><td>Account &bull;&bull;&bull;&bull;${a.last4}<span class="meta">${esc(a.lender)}${a.closed?' &middot; Closure date reported':''}</span></td><td><input style="width:125px;border:1px solid var(--line);border-radius:8px;padding:10px" type="number" min="0" step="1" name="amount_${a.id}" value="${v.amount??''}" placeholder="Unknown" aria-label="Current repayment for account ${a.last4}"></td><td><select name="frequency_${a.id}" aria-label="Repayment frequency for account ${a.last4}" style="padding:10px;border:1px solid var(--line);border-radius:8px">${['Monthly','Fortnightly','Weekly','Statement payment','Other'].map(f=>`<option ${v.frequency===f?'selected':''}>${f}</option>`).join('')}</select></td><td><select name="product_${a.id}" aria-label="Your product label for account ${a.last4}" style="max-width:150px;padding:10px;border:1px solid var(--line);border-radius:8px">${['Not confirmed','Personal loan','Credit card','Microfinance / group loan','Other'].map(f=>`<option ${v.product===f?'selected':''}>${f}</option>`).join('')}</select></td></tr>`;}).join('')}</tbody></table></div><p class="footnote">A card statement payment is not necessarily a fixed EMI. Do not count the same card instalment both as a statement payment and a separate EMI. A source closure date does not prove there are no remaining disputes.</p><div class="form-actions"><button class="btn" type="submit">Save my current details ${icon('check')}</button>${link('thrive-dashboard','Back to my review','btn secondary')}</div><div id="emi-result" class="form-hint" role="status"></div></form>`);}
function thriveEnquiry(){S.product='thrive';return app(`${appTitle('Your Thrive goal','What would you like to change?','Share your priorities once. They stay with your case even when we start with Relive.')}<div class="routing-banner">${icon('flag')}<div><h3>This request starts with a Relive review.</h3><p>The supplied report has unresolved overdue indicators. Your consolidation preference is retained; no consolidation offer or eligibility is confirmed.</p></div></div><form id="thrive-enquiry-form" class="card"><h3>What matters most?</h3><div class="choice-grid">${C.goals.map(g=>`<label class="choice"><input type="checkbox" name="goals" value="${esc(g)}" ${S.goals.includes(g)?'checked':''}><span>${g}</span></label>`).join('')}</div><div class="field"><label for="goal-note">Tell us more about what you are looking for</label><textarea id="goal-note" name="note" maxlength="2500" placeholder="For example: I would like fewer repayment dates and a clearer monthly commitment.">${esc(S.enquiry.note||'')}</textarea></div><div class="stack" style="margin-top:10px">${link('concern','Explain by voice instead','text-btn','mic')}</div><div class="form-grid"><div class="field"><label for="enq-income">Monthly take-home income (optional)</label><input id="enq-income" name="income" type="number" min="0" step="1" placeholder="Not yet shared" value="${S.enquiry.income??''}"></div><div class="field"><label for="enq-essentials">Essential monthly expenses (optional)</label><input id="enq-essentials" name="essentials" type="number" min="0" step="1" placeholder="Not yet shared" value="${S.enquiry.essentials??''}"></div><div class="field"><label for="target-emi">Monthly repayment you would like to explore</label><input id="target-emi" name="target" type="number" min="0" step="1" placeholder="Not sure yet" value="${S.enquiry.target??''}"><small>A preference, not a confirmed affordable amount or offer.</small></div><div class="field"><label for="employment">Income type (optional)</label><select id="employment" name="employment">${['Prefer to discuss','Salaried','Self-employed','Variable / daily earnings','Not currently earning'].map(e=>`<option ${S.enquiry.employment===e?'selected':''}>${e}</option>`).join('')}</select></div></div><div class="divider"></div><h4>Which accounts should we discuss?</h4><p class="small muted" style="margin-top:10px">All relevant accounts can be reviewed. Selecting an account does not make it eligible for consolidation.</p><div class="choice-grid">${D.accounts.filter(a=>!a.closed).map(a=>`<label class="choice"><input name="selectedAccounts" type="checkbox" value="${a.id}" ${(S.enquiry.selectedAccounts||[]).includes(a.id)?'checked':''}><span>Account &bull;&bull;&bull;&bull;${a.last4}<br><small class="muted">${esc(a.lender)}</small></span></label>`).join('')}</div>${note('We will review fees, tenure and total repayment alongside any monthly amount. Your lender makes the final lending decision.','plain')}<div class="form-actions"><button class="btn" type="submit">Save &amp; choose a callback ${icon('arrow')}</button>${link('callback','I would rather explain on the call','btn secondary','phone')}</div></form>`);}
function situation(){const f=S.finances;return app(`${appTitle('Your current situation','What is manageable right now?','You can leave an amount unknown or discuss it on the call. This form does not create a payment commitment.')}<div class="flow-layout"><form id="situation-form" class="card"><h3>Start with essential needs.</h3><div class="form-grid">${[['income','Monthly take-home income'],['essentials','Essential household expenses'],['commitments','Repayments already being made'],['buffer','Other essential buffer'],['oneTime','One-time amount available']].map(([n,l])=>`<div class="field"><label for="fin-${n}">${l}</label><input id="fin-${n}" name="${n}" type="number" min="0" step="1" placeholder="Unknown / not shared" value="${f[n]??''}"></div>`).join('')}</div><label class="check"><input name="noCapacity" type="checkbox" ${f.noCapacity?'checked':''}>I cannot currently set aside an amount for repayments.</label><div class="field"><label for="circumstances">What has changed, or what should we understand?</label><textarea name="context" id="circumstances" maxlength="2500">${esc(f.context||'')}</textarea></div><div id="cashflow" class="notice plain" style="margin-top:20px">${icon('info')}<div>Complete the four monthly fields to see the arithmetic remaining after those entries. It is not an affordable-EMI recommendation.</div></div><div class="form-actions"><button class="btn" type="submit">Save &amp; review my next steps ${icon('arrow')}</button>${link('callback','Discuss this with a person','btn secondary','phone')}</div></form><aside class="flow"><div class="card soft"><h3>Your circumstances can change.</h3><p class="muted">We need current information. An old income figure or a credit score is not proof of what you can pay now.</p></div>${note('No lender terms or payment plan have been confirmed. You are only organising the information for a review.','plain')}</aside></div>`);}
function plan(){return app(`${appTitle('My next steps','A practical plan starts with checking the facts.','This is a review checklist, not a payment order or an agreed settlement.')}<div class="main-aside"><section class="card"><div class="eyebrow">Provisional review plan</div><ol class="step-list"><li><span class="num">1</span><div><h4>${S.disputed?'Verify the disputed information.':'Get up-to-date account statements.'}</h4><p>Confirm current dues, any recent payments and the authority of anyone offering terms.</p></div></li><li><span class="num">2</span><div><h4>Clarify the inconsistent figures.</h4><p>Some overdue amounts exceed balances. Check the linked-looking records ending 1370 rather than assuming two payments are due.</p></div></li><li><span class="num">3</span><div><h4>Review your current circumstances.</h4><p>Income, essential needs and funds available must be confirmed before allocating money.</p></div></li><li><span class="num">4</span><div><h4>Discuss available options.</h4><p>Review the written terms of any lender offer, including dates and reporting implications, before deciding.</p></div></li></ol><div class="form-actions">${link('callback','Request a review call','btn','phone')}${btn('download-plan','Download my checklist','btn secondary','download')}</div></section><aside class="flow"><div class="card soft"><h3>What is known?</h3><div class="facts"><div class="fact"><small>Reported outstanding</small><strong>${money(D.report.outstanding)}</strong></div><div class="fact"><small>Current payable amount</small><strong>Not confirmed</strong></div><div class="fact"><small>Your circumstances</small><strong>${Object.keys(S.finances).length?'Shared in this demo':'Not yet shared'}</strong></div><div class="fact"><small>Lender offer</small><strong>Not received</strong></div></div></div>${S.origin==='thrive'?note('Your Thrive consolidation goal remains attached. This review is not a loan rejection or a promise of future approval.'):''}</aside></div>`);}
function callback(){return app(`${appTitle('Speak to us','Let us arrange a conversation.','You do not have to complete the online assessment or add documents to request human support.')}<div class="flow-layout"><form id="callback-form" class="card"><div class="between"><div><div class="eyebrow">Your verified demo number</div><h3>+91 &bull;&bull;&bull;&bull;&bull;&bull;${S.mobile.slice(-4)}</h3></div>${icon('phone')}</div><div class="form-grid"><div class="field"><label for="callback-language">Preferred language</label><select id="callback-language" name="language">${['English','Hindi','Marathi','Tamil','Telugu','Kannada','Bengali','Other - discuss availability'].map(x=>`<option ${S.language===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="callback-time">Preferred time</label><select id="callback-time" name="slot" required><option value="">Choose a preference</option><option>Morning (9 a.m. - noon)</option><option>Afternoon (noon - 3 p.m.)</option><option>Evening (3 p.m. - 6 p.m.)</option><option>Discuss a suitable time</option></select><small>IST. A preference, not a confirmed appointment.</small></div></div><div class="field"><label for="callback-note">Anything we should know before calling? (optional)</label><textarea id="callback-note" name="note" maxlength="2000" placeholder="Give us a little context so we can help.">${esc(S.enquiry.note||S.message||'')}</textarea></div>${S.origin==='thrive'&&S.reportPermission?note('<strong>Relive-first review.</strong> Your consolidation goal will be passed with this request because the sample report has unresolved overdue indicators.'):''}<label class="check"><input id="callback-consent" name="consent" type="checkbox" required>Please contact me about this request. This is separate from marketing permission.</label><button type="submit" class="btn full">Request my callback ${icon('arrow')}</button><p class="footnote">Prototype: this creates a local preview request only. No call is scheduled or sent to a team.</p></form><aside class="flow"><div class="card soft"><h3>A conversation, not another long form.</h3><p class="muted">We will ask about the details relevant to your concern. Your earlier inputs stay with your request.</p></div><div class="card"><h4>Prefer to call directly?</h4><p class="small muted">The verified Relive support number has not been configured in this prototype. Do not use the demonstration customer's number as a helpline.</p></div>${link('rights','Read Your Rights','text-btn','shield')}</aside></div>`);}
function callbackDone(){const c=S.callback;if(!c)return callback();return app(`<div style="max-width:760px;margin:18px auto"><div class="card"><div class="preview-label">LOCAL DEMO CONFIRMATION &middot; no request has been transmitted</div><div class="success-icon">${icon('check')}</div><h1 style="font-size:35px">Your request is ready for a conversation.</h1><p class="lead" style="font-size:16px;margin-top:18px">In the connected service, our team would review this context before calling you. This prototype keeps it in the current browser session only.</p><div class="request-summary"><div class="facts">${[['Reference',c.ref],['Team / route',c.team],['Language',c.language],['Time preference',c.slot]].map(([k,v])=>`<div class="fact"><small>${k}</small><strong>${esc(v)}</strong></div>`).join('')}</div><p style="margin-top:14px"><strong>Your goal:</strong> ${esc(c.goal)}</p></div><div class="form-actions">${link('case','View my request','btn','arrow')}${btn('download-request','Download the preview request','btn secondary','download')}</div><p class="footnote">No loan offer, lender contact or payment commitment has been created.</p></div></div>`);}
function casePage(){return app(`${appTitle('My requests','Keep the next step in view.','Only events that happened inside this demonstration are shown. No external lender activity is invented.')}<div class="main-aside"><div class="card"><h3>Your activity</h3><div class="timeline">${(S.events.length?S.events:[{title:'Demo login completed',detail:'This is not live authentication.',time:new Date().toISOString()}]).slice().reverse().map(e=>`<div class="timeline-item"><small>${new Date(e.time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'})} IST &middot; this demo session</small><h4>${esc(e.title)}</h4><p>${esc(e.detail)}</p></div>`).join('')}</div></div><aside class="flow"><div class="card soft"><h3>Current position</h3><div class="facts"><div class="fact"><small>Report review</small><strong>${S.reportPermission?'Sample available':'Not authorised here'}</strong></div><div class="fact"><small>Lender contacted</small><strong>No</strong></div><div class="fact"><small>Offer agreed</small><strong>No</strong></div><div class="fact"><small>Callback request</small><strong>${S.callback?'Local preview only':'Not yet prepared'}</strong></div></div></div>${link('callback','Speak to us','btn','phone')}</aside></div>`);}
function documents(){return app(`${appTitle('My documents','Keep relevant evidence together.','Add a statement, payment receipt, closure letter or notice. Files stay local in this prototype.')}<div class="flow-layout"><div class="card"><h3>Add a relevant document</h3><p class="muted" style="margin-top:12px">Do not upload unnecessary identity data. The current demonstration only shows a local preview.</p><div class="field"><label for="document-file">Choose PDF, image or text (up to 10 MB)</label><input id="document-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt" multiple></div><p class="footnote">No document extraction, cloud upload or lender submission is connected.</p><div id="documents-list">${documentList()}</div></div><aside class="card soft"><h3>Not available right now?</h3><p class="muted">A missing document should not prevent you from explaining the issue.</p>${link('callback','Request a conversation','text-btn','phone')}</aside></div>`);}

function complaint(id){const a=D.accounts.find(x=>x.id===id),about=id==='relive';return app(`${appTitle(about?'Complaint about our service':'A separate review route',about?'Tell us what we should address.':'Tell us what happened.','Your concern will be treated as a request to review the facts, not an admission of a debt.')}<form id="complaint-form" class="card" data-about="${about?'relive':'lender'}"><div class="form-grid"><div class="field"><label for="complaint-org">Organisation involved</label><input id="complaint-org" name="organisation" maxlength="180" value="${esc(about?'Relive':a?.lender||'')}" required></div><div class="field"><label for="complaint-type">What is the issue?</label><select name="issue" id="complaint-type"><option>Account or payment record</option><option>Recovery conduct</option><option>Amount being requested</option><option>Earlier complaint not addressed</option><option>Relive service concern</option><option>Other</option></select></div><div class="field"><label for="complaint-date">When did this happen? (optional)</label><input name="date" id="complaint-date" type="date"></div><div class="field"><label for="complaint-ref">Earlier complaint reference (optional)</label><input name="reference" id="complaint-ref" maxlength="100"></div><div class="field span2"><label for="complaint-detail">What happened?</label><textarea id="complaint-detail" name="detail" maxlength="4000" required>${esc(S.message)}</textarea></div><div class="field span2"><label for="complaint-outcome">What would you like reviewed or corrected?</label><textarea id="complaint-outcome" name="desired" maxlength="2000" required></textarea></div></div><div class="form-actions"><button class="btn" type="submit">Prepare my complaint draft ${icon('arrow')}</button>${link('concern','Explain by voice','btn secondary','mic')}${link('callback','Speak to us','text-btn','phone')}</div><p class="footnote">Preparing a draft does not submit a complaint to any lender, agency or regulator.</p></form>`);}
function complaintText(){const c=S.complaint;return c?`Subject: Request to review my concern\n\nTo the grievance team at ${c.organisation},\n\nI would like the following issue reviewed: ${c.issue}.\n\n${c.detail}\n\nDate / period: ${c.date||'To be confirmed'}\nEarlier reference: ${c.reference||'Not supplied'}\n\nOutcome requested:\n${c.desired}\n\nPlease acknowledge this request and explain the next steps in your review.\n\nThis is a draft prepared for the customer's review. It has not been sent.`:'';}
function complaintDraft(){if(!S.complaint)return complaint();return app(`${appTitle('Review before sending','Your complaint draft.','Check the recipient, facts and evidence. No submission has been made.')}<div class="card"><div class="field" style="margin-top:0"><label for="complaint-draft">Editable draft</label><textarea id="complaint-draft" style="min-height:390px">${esc(S.complaint.edited||complaintText())}</textarea></div><div class="form-actions">${btn('download-complaint','Download the draft','btn','download')}${link('callback','Ask for a review call','btn secondary','phone')}${link('documents','Add evidence locally','text-btn','upload')}</div>${note('Sending requires a connected service, the named recipient and separate authorisation. This preview cannot send it.','plain')}</div>`);}

function impact(){return pub(`${pageHead('Live resolutions','Progress you can see.','A public view designed for verified customer outcomes, with partly hidden names and no lender identities.')}${impactSection(true)}<section class="section"><div class="wrap"><div class="grid2"><div class="card"><h3>What counts as debt resolved?</h3><p class="muted">The verified obligation discharged through a completed full repayment or completed settlement. A payment promise, offered discount or partial payment is not a completed resolution.</p><div class="compare-grid"><div class="compare-item"><h4>Illustrative settlement</h4><p>Verified dues covered: Rs 80,000<br>Payment completed: Rs 50,000<br>Confirmed reduction: Rs 30,000</p></div><div class="compare-item"><h4>What the counter shows</h4><p>Rs 80,000 debt resolved.<br>Not Rs 80,000 saved.<br>Not a new loan approval.</p></div></div></div><div class="card"><h3>How the totals stay consistent</h3><p class="muted">Today and MTD use Indian Standard Time. YTD is the financial year from 1 April. Each customer is counted once per period; each verified terminal account outcome is deduplicated.</p><p class="muted">Historical completions update their completion period, not today's total merely because verification arrived today. Reversals adjust totals. The demo button updates all affected views from one event.</p></div></div><div class="card soft" style="margin-top:24px"><h3>Public sharing is a separate choice.</h3><p class="muted">A partly hidden name alone does not guarantee anonymity. Production needs explicit approval of the public card, suitable masking and a minimised public API. Customers who do not agree must not have individual cards published.</p><p class="footnote">The private Shakti report is not used in this public feed. All feed names, products, amounts and outcomes here are fictional.</p></div><div style="margin-top:30px">${callout()}</div></div></section>`);}

function servicePage(id){const c=C.concerns.find(x=>x.id===id);if(!c)return notFound();const text={OVERDUE:['Tell us what has changed.','A loss of income, slower business or an essential expense can make an instalment difficult. Your current situation matters more than an assumed repayment capacity.','Review your dues, what is manageable and the options a lender may consider. No new arrangement has been confirmed.'],SETTLEMENT:['Some money now. A chance to review options.','Let us help you confirm current dues and understand whether your lender would consider a reduced settlement.','Read written terms and reporting implications before deciding. Settlement is not identical to full repayment, and no percentage reduction is promised.'],GROUP:['Your group-loan concern deserves to be heard.','Explain whether it concerns your own instalment, an unrecorded payment, an amount requested or recovery conduct.','Use your loan card and receipts where available. Do not assume anyone\'s liability merely from group membership.'],PAYMENT:['Bring the proof. Let us check the record.','A receipt or statement can help clarify a payment that you believe has not been reflected.','A correctly reported closed account is different from an incorrect outstanding amount. We help prepare a review request, not promise deletion.'],UNKNOWN:['Check before accepting an unfamiliar account.','Share which entry you do not recognise and what information you have.','We will review the record with you and prepare a dispute where needed. Unfamiliar lender names need verification before an allegation is confirmed.'],NEW_LOAN:['Understand what is getting in the way.','Bring the lender\'s stated reason and tell us what you hoped to achieve.','We can help review account issues and next steps. Relive and Thrive do not guarantee new-loan approval.'],RECOVERY:['Your concern is separate from repayment.','Tell us what happened, when it happened and what you would like addressed.','Get help documenting the issue and elive helps customers work through overdue dues, settlement questions, payment disputes and other loan-related concerns.','Thrive starts with the goal of organising repayments and exploring consolidation. When an account needs resolution first, the customer moves to Relive without another login and with the original goal preserved.','This deliverable is a proposed customer experience, not a statement that all integrations and operational services are live.']};const b=bodies[kind]||bodies.privacy;return pub(`${pageHead(b[0],b[1])}<section class="section"><div class="narrow"><div class="card guide-body">${b.slice(2).map(t=>`<p>${t}</p>`).join('')}<div class="form-actions">${start('Speak to us',S.product,'callback','btn','phone')}${link('relive','Back to home','btn secondary')}</div></div></div></section>`);}

function addEvent(title,detail){S.events.push({title,detail,time:new Date().toISOString()});}

function begin(product,next,concern){S.product=product;S.origin=product;S.pending=next||'concern';if(concern&&!S.concerns.includes(concern))S.concerns.push(concern);if(S.pending==='concern/type')S.method='type';if(product==='thrive'&&S.goals.length===0)S.goals=['Combine several repayments'];if(S.authenticated)go(S.pending);else go('login/'+product);}

function timeFormat(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function carouselUpdate(){const el=document.getElementById('poster-slot');if(!el)return;el.innerHTML=poster();document.getElementById('carousel-dots').innerHTML=dots();document.getElementById('carousel-count').textContent=String(S.slide+1).padStart(2,'0')+' / 06';}
function selectSlide(i){S.slide=(i+C.slides.length)%C.slides.length;S.slideElapsed=0;carouselUpdate();}
function setupCarousel(){clearInterval(carouselTimer);const c=document.getElementById('carousel');if(!c)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches)S.carouselPaused=true;c.addEventListener('mouseenter',()=>hoverPaused=true);c.addEventListener('mouseleave',()=>{hoverPaused=false;lastTick=performance.now();});c.addEventListener('focusin',()=>focusPaused=true);c.addEventListener('focusout',e=>{if(!c.contains(e.relatedTarget)){focusPaused=false;lastTick=performance.now();}});let sx=null;c.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;hoverPaused=true;},{passive:true});c.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)selectSlide(S.slide+(dx<0?1:-1));hoverPaused=false;},{passive:true});c.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();selectSlide(S.slide-1);}if(e.key==='ArrowRight'){e.preventDefault();selectSlide(S.slide+1);}});lastTick=performance.now();carouselTimer=setInterval(()=>{const n=performance.now(),delta=n-lastTick;lastTick=n;if(S.carouselPaused||hoverPaused||focusPaused||document.hidden)return;S.slideElapsed+=delta;if(S.slideElapsed>=6000)selectSlide(S.slide+1);document.querySelector('.carousel-dot.active')?.style.setProperty('--progress',Math.min(100,S.slideElapsed/60)+'%');},100);updatePauseButton();}

function simulateOutcome(){const n=++S.simCount,now=new Date().toISOString();const e={id:'DEMO-NEW-'+n,version:1,customerKey:'FICT-NEW-'+Math.ceil(n/2),accountKey:'FICT-NEW-A'+n,maskedName:n%2?'An\u2022\u2022\u2022\u2022':'An\u2022\u2022\u2022\u2022',product:n%2?'Microfinance / group loan':'Personal loan',outcome:n%2?'FULL_REPAYMENT':'SETTLEMENT_COMPLETED',amount:n%2?18000:45000,completedAt:now,verifiedAt:now,verified:true,reversed:false,publicationAllowed:true};R.ingest(S.impactEvents,e);impactUpdate();toast('Fictional verified event added. Today, MTD and YTD recalculated together.');}
function numeric(form,name){const v=form.elements[name]?.value;return v===undefined||v.trim()===''?null:Number(v);}
function financeValues(form){return {income:numeric(form,'income'),essentials:numeric(form,'essentials'),commitments:numeric(form,'commitments'),buffer:numeric(form,'buffer'),oneTime:numeric(form,'oneTime'),context:form.elements.context.value,noCapacity:form.elements.noCapacity.checked};}
function updateCashflow(){const form=document.getElementById('situation-form'),out=document.getElementById('cashflow');if(!form||!out)return;const f=financeValues(form),known=['income','essentials','commitments','buffer'].every(k=>f[k]!==null&&Number.isFinite(f[k]));out.innerHTML=icon('info')+`<div>${known?'<strong>'+money(f.income-f.essentials-f.commitments-f.buffer)+'</strong> remaining after your four monthly entries. This is arithmetic only, not a payment recommendation or lender offer.':'Complete the four monthly fields to see the arithmetic remaining. Unknown amounts are not treated as zero.'}${f.noCapacity?' You have said you cannot currently set aside a repayment amount.':''}</div>`;}
function download(name,text,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function clearAudio(){recordEpoch++;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;audioBlob=null;audioChunks=[];seconds=0;}
async function startRecording(){if(!S.consentVoice){toast('Please review and accept recording permission first.');return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Recording is unavailable here. Use typing or request a callback; try HTTPS or localhost for microphone access.');return;}const epoch=++recordEpoch;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(epoch!==recordEpoch||!route().startsWith('concern')){stream.getTracks().forEach(t=>t.stop());return;}if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;audioBlob=null;audioChunks=[];seconds=0;mediaStream=stream;mediaRecorder=new MediaRecorder(stream);const mime=mediaRecorder.mimeType;let renderAfter=true;mediaRecorder.addEventListener('dataavailable',e=>{if(e.data.size)audioChunks.push(e.data);});mediaRecorder.addEventListener('stop',()=>{stream.getTracks().forEach(t=>t.stop());recording=false;clearInterval(recordTimer);if(epoch!==recordEpoch)return;audioBlob=new Blob(audioChunks,{type:mime||'audio/webm'});audioURL=URL.createObjectURL(audioBlob);if(route().startsWith('concern'))render();});mediaRecorder.start();recording=true;render();recordTimer=setInterval(()=>{if(mediaRecorder?.state==='recording'){seconds++;const t=document.getElementById('record-timer');if(t)t.textContent=timeFormat(seconds);if(seconds>=180)finishRecording(true);}},1000);}catch(e){recording=false;toast('Microphone could not be opened. You can type your concern or request a callback.');}}
function finishRecording(){clearInterval(recordTimer);if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();else if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());recording=false;}
function reset(){finishRecording();clearAudio();S.documents.forEach(f=>URL.revokeObjectURL(f.url));Object.assign(S,{authenticated:false,mobile:D.demo.mobile,product:'relive',origin:'relive',pending:'concern',afterPermission:'relive-dashboard',reportPermission:false,concerns:[],message:'',confirmed:false,method:'voice',language:'English',consentVoice:false,disputed:false,goals:[],enquiry:{},finances:{},emiValues:{},callback:null,documents:[],complaint:null,events:[],filter:'all',search:'',slide:0,carouselPaused:false,slideElapsed:0,permissionLog:[]});seedImpact();go('relive');toast('Demo session reset. No server-side data was created.');}
document.addEventListener('click',e=>{if(e.target.closest('a[href="#main"]')){e.preventDefault();document.getElementById('main')?.focus();return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 switch(a){
 case 'start':begin(el.dataset.product||'relive',el.dataset.next,el.dataset.concern);break;
 case 'menu':{const n=document.querySelector('.mobile-nav');n?.classList.toggle('open');el.setAttribute('aria-expanded',String(n?.classList.contains('open')));break;}
 case 'reset':reset();break;
 case 'logout':reset();toast('Signed out. Entered data cleared from this demo session.');break;
 case 'resend':toast('Demo code: 123456. No SMS was sent.');break;
 case 'demo-relive':startSample('relive');break;
 case 'demo-thrive':startSample('thrive');break;
 case 'prev':selectSlide(S.slide-1);break;case 'next':selectSlide(S.slide+1);break;case 'slide':selectSlide(Number(el.dataset.index));break;
 case 'pause-carousel':S.carouselPaused=!S.carouselPaused;updatePauseButton();break;
 case 'method':S.message=document.getElementById('concern-text')?.value||S.message;S.method=el.dataset.method;render();break;
 case 'start-record':startRecording();break;
 case 'stop-record':finishRecording();break;
 case 'pause-record':if(mediaRecorder?.state==='recording'){mediaRecorder.pause();el.innerHTML=icon('play')+' Resume';}else if(mediaRecorder?.state==='paused'){mediaRecorder.resume();el.innerHTML=icon('pause')+' Pause';}break;
 case 'delete-record':finishRecording();clearAudio();render();break;
 case 'confirm-story':{S.message=document.getElementById('concern-text').value.trim();if(!S.concerns.length&&!S.message&&!audioURL){document.getElementById('story-error').textContent='Choose a concern, add a note, record your voice or request a callback.';return;}go('confirm');break;}
 case 'story-correct':S.message=document.getElementById('confirm-text').value.trim();S.disputed=document.getElementById('disputed').checked;S.confirmed=true;addEvent('Concern confirmed','Selected concerns and customer words retained; no live AI interpretation.');S.afterPermission=S.origin==='thrive'?'thrive-dashboard':'relive-dashboard';go(S.reportPermission?S.afterPermission:'permission');break;
 case 'use-report':if(!document.getElementById('source-consent').checked){toast('Review and accept the sample-use permission before continuing.');return;}S.reportPermission=true;S.permissionLog.push({type:'supplied-report-review',time:new Date().toISOString()});addEvent('Supplied report review accepted','Existing sample report only; no new bureau retrieval.');go(S.afterPermission||'relive-dashboard');break;
 case 'filter':S.filter=el.dataset.filter;render();break;
 case 'impact-add':simulateOutcome();break;
 case 'impact-replay':{const e=S.impactEvents.find(x=>x.id==='DEMO-NEW-'+S.simCount)||S.impactEvents[0];const added=R.ingest(S.impactEvents,{...e});impactUpdate();toast(added?'Updated event.':'Duplicate event ignored. Totals did not increase.');break;}
 case 'impact-reverse':{const e=S.impactEvents.find(x=>x.id==='DEMO-NEW-'+S.simCount);if(!e){toast('Add a fictional event first.');return;}if(e.reversed){toast('This event is already reversed.');return;}R.ingest(S.impactEvents,{...e,version:e.version+1,reversed:true});impactUpdate();toast('Last fictional event reversed. Totals recalculated.');break;}
 case 'impact-reset':seedImpact();impactUpdate();toast('Sample figures reset.');break;
 case 'remove-file':{const i=Number(el.dataset.index);URL.revokeObjectURL(S.documents[i].url);S.documents.splice(i,1);document.getElementById('documents-list').innerHTML=documentList();break;}
 case 'download-facts':download('Relive_Thrive_Minimised_Sample_Facts.json',JSON.stringify(D,null,2),'application/json');break;
 case 'download-request':download('CGreen_Callback_Request_Preview.json',JSON.stringify({prototype:true,notTransmitted:true,request:S.callback,goals:S.goals,enquiry:S.enquiry,route:S.disputed?'VERIFICATION_FIRST':S.reportPermission?R.route(D):'CALLBACK_ONLY'},null,2),'application/json');break;
 case 'download-complaint':S.complaint.edited=document.getElementById('complaint-draft').value;download('Relive_Complaint_Draft.txt',S.complaint.edited);break;
 case 'download-plan':download('Relive_Review_Checklist.txt','RELIVE - PROVISIONAL REVIEW CHECKLIST\nPrivate design prototype. Not a payment instruction.\n\n1. Confirm current statements and disputes.\n2. Clarify conflicting amounts and possible linked records.\n3. Review income, essential needs and current commitments.\n4. Review written lender options, if any.\n\nNo offer, lender contact or payment order is confirmed.\nOriginal goal: '+(S.origin==='thrive'?'Simplify EMIs; Relive-first review.':'Resolve loan issues.')+'\n\nCustomer-reported details:\n'+JSON.stringify(S.finances,null,2));break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='account-search'){S.search=e.target.value;document.getElementById('account-results').innerHTML=accountTable();}
 if(e.target.id==='concern-text')S.message=e.target.value;
 if(e.target.closest('#situation-form'))updateCashflow();
});
document.addEventListener('change',e=>{
 if(e.target.name==='concern'){if(e.target.checked){if(!S.concerns.includes(e.target.value))S.concerns.push(e.target.value);}else S.concerns=S.concerns.filter(x=>x!==e.target.value);}
 if(e.target.id==='voice-consent')S.consentVoice=e.target.checked;
 if(e.target.id==='voice-language')S.language=e.target.value;
 if(e.target.id==='document-file'){
  const allowed=['pdf','png','jpg','jpeg','txt'];for(const f of e.target.files){const ext=f.name.toLowerCase().split('.').pop();if(f.size>10*1024*1024||!allowed.includes(ext)){toast('Use a PDF, PNG, JPEG or text file up to 10 MB.');continue;}S.documents.push({name:f.name,size:f.size,url:URL.createObjectURL(f)});}document.getElementById('documents-list').innerHTML=documentList();e.target.value='';
 }
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id)return;e.preventDefault();if(!f.reportValidity())return;
 if(f.id==='login-form'){
  const n=f.elements.mobile.value.trim();if(n!==D.demo.mobile){document.getElementById('login-error').textContent='This private sample only accepts 1234567891. Other numbers cannot open this borrower\'s data.';return;}
  S.mobile=n;S.product=f.dataset.product;S.origin=S.product;if(f.dataset.landing==='true'||S.product==='thrive'&&S.pending==='concern')S.pending='thrive-dashboard';if(S.product==='thrive'&&!S.goals.length)S.goals=['Combine several repayments'];go('otp');
 }else if(f.id==='otp-form'){
  if(f.elements.otp.value!==D.demo.otp){document.getElementById('otp-error').textContent='Use the demo code 123456. No live verification is taking place.';return;}afterLogin();
 }else if(f.id==='situation-form'){
  S.finances=financeValues(f);addEvent('Current situation captured locally','Customer-reported fields; no amount is confirmed as affordable.');go('plan');
 }else if(f.id==='thrive-enquiry-form'){
  S.goals=[...f.querySelectorAll('[name=goals]:checked')].map(x=>x.value);S.enquiry={note:f.elements.note.value.trim(),income:numeric(f,'income'),essentials:numeric(f,'essentials'),target:numeric(f,'target'),employment:f.elements.employment.value,selectedAccounts:[...f.querySelectorAll('[name=selectedAccounts]:checked')].map(x=>x.value)};
  addEvent('Thrive goal saved locally','Consolidation preferences retained alongside the Relive-first review.');go('callback');
 }else if(f.id==='emi-form'){
  S.emiValues={};for(const a of D.accounts){const amount=numeric(f,'amount_'+a.id);if(amount!==null)S.emiValues[a.id]={amount,frequency:f.elements['frequency_'+a.id].value,product:f.elements['product_'+a.id].value,source:'customer_reported'};}
  const vals=Object.values(S.emiValues),monthly=vals.filter(v=>v.frequency==='Monthly').reduce((n,v)=>n+v.amount,0);document.getElementById('emi-result').textContent=vals.length?vals.length+' amount(s) shared. Known customer-reported monthly subtotal: '+money(monthly)+'. Other frequencies and blank accounts are excluded. Not a complete verified EMI total.':'No figures entered. Unknown values remain unknown.';
  addEvent('Current commitments saved locally','Customer-reported values do not replace source fields.');toast('Saved for this demo session. The bureau amounts are unchanged.');
 }else if(f.id==='callback-form'){
  const team=S.origin==='thrive'&&S.reportPermission?(S.disputed?'Verification review; Thrive goal retained':'Relive first; Thrive goal retained'):S.origin==='thrive'?'Thrive enquiry':'Relive support';
  S.callback={ref:'DEMO-REQ-'+String(S.events.length+1).padStart(3,'0'),team,language:f.elements.language.value,slot:f.elements.slot.value,note:f.elements.note.value.trim(),goal:S.goals.length?S.goals.join('; '):S.concerns.length?S.concerns.map(concernName).join('; '):'Speak with the team',consented:true,localOnly:true,createdAt:new Date().toISOString()};S.language=S.callback.language;addEvent('Callback preview prepared','No request transmitted. Context and team routing saved in this browser session.');go('callback-confirmation');
 }else if(f.id==='complaint-form'){
  S.complaint={organisation:f.elements.organisation.value.trim(),issue:f.elements.issue.value,date:f.elements.date.value,reference:f.elements.reference.value.trim(),detail:f.elements.detail.value.trim(),desired:f.elements.desired.value.trim(),about:f.dataset.about};addEvent('Complaint draft prepared','Customer allegations only; not submitted to a recipient.');go('complaint-draft');
 }
});
window.addEventListener('hashchange',render);window.addEventListener('pagehide',()=>{finishRecording();if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());});
seedImpact();render();
// For automated private-preview QA only; production must remove this object and fixtures.
window.CGREEN_PREVIEW={state:S,rules:R,pages,render,startSample,seedImpact};

</script></body></html>
